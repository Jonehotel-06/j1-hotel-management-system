<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | J-ONE Hotel &amp; Lodge</title>
  <script>
  // Read the one-use link into this closure and remove it from the address bar
  // before styles, images, or other scripts are requested. Never log or store it.
  (function () {
    "use strict";
    var params = new URLSearchParams(window.location.search);
    var uid = params.get("uid") || "", token = params.get("token") || "";
    if (uid || token) {
      try { window.history.replaceState(null, "", window.location.pathname); } catch (_) {}
    }
    document.addEventListener("DOMContentLoaded", function () {
      var requestForm = document.getElementById("request-reset");
      var confirmForm = document.getElementById("confirm-reset");
      var message = document.getElementById("reset-message");
      function show(text, error) {
        message.textContent = text;
        message.classList.toggle("reset-error", !!error);
      }
      if (uid && token) {
        requestForm.hidden = true;
        confirmForm.hidden = false;
      } else if (uid || token) {
        show("This link is incomplete. Request a new reset link below.", true);
      }
      requestForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!requestForm.reportValidity()) return;
        var button = requestForm.querySelector("button[type=submit]");
        if (button.disabled) return;
        button.disabled = true;
        show("");
        try {
          await window.API.post("/api/auth/password/reset/", {
            email: document.getElementById("reset-email").value.trim()
          }, {auth: false});
          show("If an account exists for this email, a reset link has been sent.");
          requestForm.reset();
        } catch (err) {
          show((err && err.message) || "We could not request a link. Please try again.", true);
        } finally { button.disabled = false; }
      });
      confirmForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!confirmForm.reportValidity()) return;
        var password = document.getElementById("new-password").value;
        var confirmation = document.getElementById("confirm-password").value;
        if (password !== confirmation) { show("Passwords do not match.", true); return; }
        var button = confirmForm.querySelector("button[type=submit]");
        if (button.disabled) return;
        button.disabled = true;
        show("");
        try {
          await window.API.post("/api/auth/password/reset/confirm/", {
            uid: uid, token: token, new_password: password, new_password_confirm: confirmation
          }, {auth: false});
          uid = ""; token = "";
          confirmForm.reset();
          confirmForm.hidden = true;
          show("Your password has been reset. You can now sign in.");
        } catch (err) {
          show((err && err.message) || "This link could not be used. Request a new reset link.", true);
        } finally { button.disabled = false; }
      });
    });
  })();
  </script>
  <script>
  /* Pre-paint theme: use only the saved appearance preference, never reset credentials. */
  (function(){try{var k="jone.theme";var s=window.localStorage;var raw=(s&&s.getItem(k))||null;var v=null;try{v=JSON.parse(raw);}catch(e){v=raw;}if(v!=="dark"&&v!=="light"){v=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",v);document.documentElement.style.colorScheme=v;}catch(e){}})();
  </script>
  <link rel="stylesheet" href="css/main.css?v=1.1.23">
  <style>
    .reset-main { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
    .reset-card { width: min(100%, 30rem); }
    .reset-message { margin-top: 1rem; }
    .reset-error { color: var(--color-danger, #a12c2c); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="reset-main">
    <section class="card card-pad reset-card" aria-labelledby="reset-title">
      <p class="eyebrow">J-ONE Hotel &amp; Lodge</p>
      <h1 id="reset-title">Reset your password</h1>
      <p class="muted">Request a secure reset link, or use the link sent to your email.</p>
      <noscript>JavaScript is required to request or complete a password reset.</noscript>
      <form id="request-reset">
        <div class="field">
          <label class="field-label" for="reset-email">Email address</label>
          <input class="input" id="reset-email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn-block" type="submit">Send reset link</button>
      </form>
      <form id="confirm-reset" hidden>
        <div class="field">
          <label class="field-label" for="new-password">New password</label>
          <input class="input" id="new-password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label class="field-label" for="confirm-password">Confirm new password</label>
          <input class="input" id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn btn-block" type="submit">Reset password</button>
      </form>
      <p id="reset-message" class="reset-message" role="status" aria-live="polite"></p>
      <p><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/runtime-config.js?v=1.1.23"></script>
  <script src="js/config.js?v=1.1.23"></script>
  <script src="js/api.js?v=1.1.23"></script>
</body>
</html>
