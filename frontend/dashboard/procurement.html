<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Procurement | J-ONE Staff</title><meta name="theme-color" content="#373435"><link rel="icon" href="../favicon/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="J-ONE Hotel"><link rel="stylesheet" href="../css/main.css?v=1.1.6"><style>.op-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}.op-tabs .is-active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}</style></head>
<body><div class="dash"><aside class="dash-sidebar" aria-label="Staff navigation"><div class="dash-sidebar-brand"><img src="../assets/icons/logo-official.svg" alt="" width="30" height="42"><span><span class="brand-word">J-ONE</span><br><span class="brand-sub">Staff Console</span></span></div><nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav><div class="dash-sidebar-footer"><div data-dash-user></div><button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,.2);"><span data-icon="logOut" data-size="16"></span> Sign out</button></div></aside><div class="dash-main"><div class="dash-topbar"><div class="dash-topbar-left"><button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button><div class="dash-title" data-dash-title><h1>Procurement</h1><p>Supplier records, controlled purchase orders, approvals, and receipts.</p></div></div><div class="dash-topbar-right"><div class="dash-topbar-actions" data-topbar-actions></div><button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false"><span class="icon-moon" data-icon="moon" data-size="18"></span><span class="icon-sun" data-icon="sun" data-size="18"></span></button></div></div><main class="dash-content"><div class="op-tabs" role="tablist" aria-label="Procurement views"><button class="btn btn-sm is-active" type="button" role="tab" aria-selected="true" data-proc-tab="orders">Purchase orders</button><button class="btn btn-sm btn-outline" type="button" role="tab" aria-selected="false" data-proc-tab="suppliers">Suppliers</button></div>
<section class="panel" data-proc-panel="orders"><div class="panel-head"><h2>Purchase orders</h2><div class="panel-actions"><button class="btn btn-sm" type="button" data-proc-new-order><span data-icon="plus" data-size="15"></span> New purchase order</button></div></div><div class="filter-bar"><div class="field"><label class="field-label" for="proc-order-status">Status</label><select class="select" id="proc-order-status"><option value="">All statuses</option><option value="DRAFT">Draft</option><option value="SUBMITTED">Awaiting approval</option><option value="APPROVED">Approved</option><option value="ORDERED">Ordered</option><option value="PARTIALLY_RECEIVED">Partially received</option><option value="RECEIVED">Received</option><option value="CANCELLED">Cancelled</option></select></div><div class="field"><button class="btn btn-sm btn-outline" type="button" data-proc-order-apply>Apply</button></div></div><div class="panel-body no-pad"><div class="table-wrap" tabindex="0" role="region" aria-label="Purchase orders"><table class="table"><thead><tr><th>Purchase order</th><th>Supplier</th><th>Deliver to</th><th>Status</th><th class="hide-sm">Expected</th><th class="hide-sm">Lines</th><th></th></tr></thead><tbody data-proc-order-rows></tbody></table></div><div class="pagination" data-proc-order-pagination></div></div></section>
<section class="panel" data-proc-panel="suppliers" hidden><div class="panel-head"><h2>Suppliers</h2><div class="panel-actions"><button class="btn btn-sm" type="button" data-proc-new-supplier><span data-icon="plus" data-size="15"></span> Add supplier</button></div></div><div class="filter-bar"><div class="field"><label class="field-label" for="proc-supplier-status">Status</label><select class="select" id="proc-supplier-status"><option value="">All statuses</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></div><div class="field"><label class="field-label" for="proc-supplier-search">Search</label><input class="input" id="proc-supplier-search" type="search" placeholder="Name, email, or phone"></div><div class="field"><button class="btn btn-sm btn-outline" type="button" data-proc-supplier-apply>Apply</button></div></div><div class="panel-body no-pad"><div class="table-wrap" tabindex="0" role="region" aria-label="Suppliers"><table class="table"><thead><tr><th>Supplier</th><th>Contact</th><th>Terms</th><th>Status</th><th class="hide-sm">Reference</th><th></th></tr></thead><tbody data-proc-supplier-rows></tbody></table></div><div class="pagination" data-proc-supplier-pagination></div></div></section>
</main></div></div>
<script src="../js/runtime-config.js?v=1.1.6"></script><script src="../js/config.js?v=1.1.6"></script><script src="../js/utils.js?v=1.1.6"></script><script src="../js/icons.js?v=1.1.6"></script><script src="../js/api.js?v=1.1.6"></script><script src="../js/theme.js?v=1.1.6"></script><script src="../js/ui.js?v=1.1.6"></script><script src="../js/auth.js?v=1.1.6"></script><script src="../js/navigation.js?v=1.1.6"></script><script src="../js/dashboard.js?v=1.1.6"></script><script src="../js/operations.js?v=1.1.6"></script>
<script>
JONE.ui.initChrome();var __procurementAllowed=JONE.dashboard.boot(["admin","manager","inventory_clerk"]);document.querySelector("[data-logout]")&&document.querySelector("[data-logout]").addEventListener("click",function(){window.Auth.logout();});
(function(){
if(!__procurementAllowed)return;var DATA=JONE.dashboard.DATA,OPS=JONE.operations,state={tab:"orders",pages:{orders:1,suppliers:1}};var orderRows=document.querySelector("[data-proc-order-rows]"),supplierRows=document.querySelector("[data-proc-supplier-rows]");function manager(){return window.Auth&&window.Auth.hasAnyRole&&window.Auth.hasAnyRole(["admin","manager"]);}function date(value){return value?JONE.formatDate(value):"—";}function dateTime(value){return value?JONE.formatDateTime(value):"—";}function pageFor(name){return state.pages[name]||1;}function setPage(name,page){state.pages[name]=Math.max(1,page||1);}function pager(selector,items,response,loader){JONE.dashboard.renderPagination(document.querySelector(selector),items.length?response.pagination:null,{onPage:function(next){setPage(state.tab,next);loader(next);}});}
function supplierPicker(){return OPS.searchPicker({name:"supplier_id",label:"Supplier",required:true,resource:"suppliers",params:{status:"ACTIVE"},placeholder:"Search active supplier",display:function(row){return row.name+(row.reference?" · "+row.reference:"");}});}function locationPicker(){return OPS.searchPicker({name:"delivery_location_id",label:"Delivery location",required:true,resource:"inventoryLocations",params:{active:"true"},placeholder:"Search location code or name",display:function(row){return (row.code||"")+" · "+(row.name||"");}});}function orderLines(){return OPS.linePicker({name:"lines",label:"purchase-order line",required:true,resource:"inventoryItems",params:{active:"true"},placeholder:"Search a stock item to add",display:function(row){return (row.sku||"")+" · "+(row.name||"");},lineFields:[{name:"quantity_ordered",label:"Quantity",type:"number",min:"0.0001",step:"0.0001",defaultValue:"1",required:true},{name:"unit_cost",label:"Unit cost (NGN)",type:"number",min:"0",step:"0.01",defaultValue:"0",required:true}]});}
async function loadOrders(page){if(page!=null)setPage("orders",page);DATA.loading(orderRows);try{var params={page:pageFor("orders"),page_size:JONE.dashboard.pageSize()},status=document.getElementById("proc-order-status").value;if(status)params.status=status;var response=await window.API.list("purchaseOrders",params),items=OPS.listItems(response);if(!items.length){DATA.empty(orderRows,"receipt","No purchase orders found","Create a controlled draft to begin a procurement workflow.",7);}else{orderRows.innerHTML=items.map(function(row){return '<tr><td><strong>'+JONE.esc(row.reference)+'</strong><br><small>'+JONE.esc(row.supplier_reference||"—")+'</small></td><td>'+JONE.esc(row.supplier_name)+'</td><td>'+JONE.esc(row.delivery_location_code)+'</td><td>'+JONE.dashboard.statusPill(row.status)+'</td><td class="hide-sm">'+JONE.esc(date(row.expected_on))+'</td><td class="hide-sm">'+JONE.esc(row.line_count)+'</td><td><button class="btn btn-sm btn-outline" type="button" data-proc-order-view="'+JONE.esc(row.reference)+'">View</button></td></tr>';}).join("");}pager("[data-proc-order-pagination]",items,response,loadOrders);}catch(err){DATA.error(orderRows,"Purchase orders couldn't be loaded",(err&&err.message)||"Please try again in a moment.",7);}}
async function loadSuppliers(page){if(page!=null)setPage("suppliers",page);DATA.loading(supplierRows);try{var params={page:pageFor("suppliers"),page_size:JONE.dashboard.pageSize()},status=document.getElementById("proc-supplier-status").value,search=document.getElementById("proc-supplier-search").value.trim();if(status)params.status=status;if(search)params.search=search;var response=await window.API.list("suppliers",params),items=OPS.listItems(response);if(!items.length){DATA.empty(supplierRows,"users","No suppliers found","Add a supplier or adjust the filters.",6);}else{supplierRows.innerHTML=items.map(function(row){return '<tr><td><strong>'+JONE.esc(row.name)+'</strong><br><small>'+JONE.esc(row.email||"—")+'</small></td><td>'+JONE.esc(row.contact_name||"—")+'<br><small>'+JONE.esc(row.phone||"—")+'</small></td><td>'+JONE.esc(row.payment_terms||"—")+'</td><td>'+JONE.dashboard.statusPill(row.status)+'</td><td class="hide-sm">'+JONE.esc(row.reference)+'</td><td><button class="btn btn-sm btn-outline" type="button" data-proc-supplier-edit="'+JONE.esc(row.id)+'">Edit</button></td></tr>';}).join("");}pager("[data-proc-supplier-pagination]",items,response,loadSuppliers);}catch(err){DATA.error(supplierRows,"Suppliers couldn't be loaded",(err&&err.message)||"Please try again in a moment.",6);}}
async function newSupplier(){var result=await JONE.dashboard.formModal({title:"Add supplier",submitText:"Create supplier",wide:true,fields:[{name:"name",label:"Supplier name",type:"text",required:true},{name:"contact_name",label:"Contact name",type:"text"},{name:"email",label:"Email",type:"email"},{name:"phone",label:"Phone",type:"tel"},{name:"payment_terms",label:"Payment terms",type:"text",placeholder:"e.g. 30 days"},{name:"tax_reference",label:"Tax reference",type:"text"},{name:"address",label:"Address",type:"textarea",rows:2},{name:"notes",label:"Notes",type:"textarea",rows:2}],onSubmit:async function(values){await window.API.create("suppliers",OPS.omitEmpty(values));return{message:"Supplier created."};}});if(result){JONE.ui.toast("Supplier created.","success");loadSuppliers(1);}}
async function editSupplier(id){var response;try{response=await window.API.getOne("suppliers",id);}catch(err){JONE.ui.toast((err&&err.message)||"Supplier details couldn't be loaded.","error");return;}var data=response.data||{};var result=await JONE.dashboard.formModal({title:"Edit supplier",submitText:"Save supplier",wide:true,values:data,fields:[{name:"name",label:"Supplier name",type:"text",required:true},{name:"status",label:"Status",type:"select",required:true,options:[{value:"ACTIVE",label:"Active"},{value:"INACTIVE",label:"Inactive"}]},{name:"contact_name",label:"Contact name",type:"text"},{name:"email",label:"Email",type:"email"},{name:"phone",label:"Phone",type:"tel"},{name:"payment_terms",label:"Payment terms",type:"text"},{name:"tax_reference",label:"Tax reference",type:"text"},{name:"address",label:"Address",type:"textarea",rows:2},{name:"notes",label:"Notes",type:"textarea",rows:2}],onSubmit:async function(values){await window.API.update("suppliers",id,OPS.omitEmpty(values));return{message:"Supplier updated."};}});if(result){JONE.ui.toast("Supplier updated.","success");loadSuppliers();}}
async function newOrder(){var result=await JONE.dashboard.formModal({title:"Create purchase-order draft",submitText:"Create draft",wide:true,fields:[supplierPicker(),locationPicker(),orderLines(),{name:"expected_on",label:"Expected delivery date",type:"date"},{name:"supplier_reference",label:"Supplier quotation/reference",type:"text"},{name:"notes",label:"Notes",type:"textarea",rows:3}],onSubmit:async function(values){values=OPS.omitEmpty(values);values.idempotency_key=OPS.newIdempotencyKey("purchase-order");await window.API.create("purchaseOrders",values);return{message:"Purchase-order draft created."};}});if(result){JONE.ui.toast("Purchase-order draft created.","success");loadOrders(1);}}
async function getOrder(reference){return (await window.API.getOne("purchaseOrders",reference)).data||{};}function orderLinesHtml(lines){return '<div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Ordered</th><th>Received</th><th>Unit cost</th><th>Outstanding</th></tr></thead><tbody>'+lines.map(function(line){var outstanding=Math.max(0,Number(line.quantity_ordered)-Number(line.quantity_received));return '<tr><td><strong>'+JONE.esc(line.item_sku)+'</strong><br><small>'+JONE.esc(line.item_name)+'</small></td><td class="num">'+JONE.esc(line.quantity_ordered)+'</td><td class="num">'+JONE.esc(line.quantity_received)+'</td><td class="num">'+JONE.esc(line.unit_cost)+'</td><td class="num">'+JONE.esc(outstanding.toFixed(4))+'</td></tr>';}).join("")+'</tbody></table></div>';}
async function viewOrder(reference){var body=JONE.el("div",{class:"loading-skeleton",textContent:"Loading purchase order…"}),footer=JONE.el("div",{});JONE.ui.modal.open({title:"Purchase order "+reference,body:body,size:"modal-lg",footer:footer});try{var order=await getOrder(reference),lines=order.lines||[];body.innerHTML='<dl class="profile-grid"><div><dt>Supplier</dt><dd>'+JONE.esc(order.supplier_name)+'</dd></div><div><dt>Delivery location</dt><dd>'+JONE.esc(order.delivery_location_code)+'</dd></div><div><dt>Status</dt><dd>'+JONE.dashboard.statusPill(order.status)+'</dd></div><div><dt>Expected</dt><dd>'+JONE.esc(date(order.expected_on))+'</dd></div><div><dt>Requested by</dt><dd>'+JONE.esc(order.requested_by_email||"—")+'</dd></div><div><dt>Approved by</dt><dd>'+JONE.esc(order.approved_by_email||"—")+'</dd></div></dl>'+orderLinesHtml(lines)+'<p class="hint" style="margin-top:.75rem">'+JONE.esc(order.notes||"No notes recorded.")+'</p>';function action(label,cls,handler){var button=JONE.el("button",{class:"btn btn-sm "+(cls||""),type:"button",textContent:label});button.addEventListener("click",handler);footer.appendChild(button);}if(order.status==="DRAFT")action("Submit for approval","",function(){JONE.ui.modal.close();transitionOrder(reference,"submit");});if(order.status==="SUBMITTED"&&manager())action("Approve","btn-accent",function(){JONE.ui.modal.close();transitionOrder(reference,"approve");});if(order.status==="APPROVED")action("Mark ordered","",function(){JONE.ui.modal.close();transitionOrder(reference,"ordered");});if(["ORDERED","PARTIALLY_RECEIVED"].includes(order.status))action("Record receipt","",function(){JONE.ui.modal.close();recordReceipt(reference,order);});}catch(err){body.innerHTML='<div class="empty-state"><h3>Purchase order unavailable</h3><p>'+JONE.esc((err&&err.message)||"Please try again.")+'</p></div>';}}
async function transitionOrder(reference,action){try{await window.API.resourceAction("purchaseOrders",reference,action,{});JONE.ui.toast("Purchase order updated.","success");loadOrders();}catch(err){JONE.ui.toast((err&&err.message)||"The purchase order couldn't be updated.","error");}}
function receiptField(order){return{name:"receipt_lines",label:"Received quantities",type:"custom",required:true,render:function(mount){var outstanding=(order.lines||[]).filter(function(line){return Number(line.quantity_ordered)>Number(line.quantity_received);});var wrap=document.createElement("div");wrap.className="table-wrap";wrap.innerHTML='<table class="table"><thead><tr><th>Item</th><th>Outstanding</th><th>Receive now</th><th>Unit cost</th></tr></thead><tbody>'+outstanding.map(function(line){var remain=(Number(line.quantity_ordered)-Number(line.quantity_received)).toFixed(4);return '<tr><td>'+JONE.esc(line.item_sku)+" · "+JONE.esc(line.item_name)+'</td><td class="num">'+JONE.esc(remain)+'</td><td><input class="input" type="number" min="0" step="0.0001" value="0" data-proc-receipt-qty="'+JONE.esc(line.id)+'" data-proc-receipt-max="'+JONE.esc(remain)+'"></td><td><input class="input" type="number" min="0" step="0.01" value="'+JONE.esc(line.unit_cost)+'" data-proc-receipt-cost="'+JONE.esc(line.id)+'"></td></tr>';}).join("")+'</tbody></table>';mount.appendChild(wrap);},getValue:function(){var lines=[];document.querySelectorAll("[data-proc-receipt-qty]").forEach(function(input){var qty=Number(input.value||0),id=Number(input.getAttribute("data-proc-receipt-qty")),max=Number(input.getAttribute("data-proc-receipt-max")),cost=document.querySelector('[data-proc-receipt-cost="'+id+'"]');if(qty>0)lines.push({purchase_order_line_id:id,quantity_received:input.value,unit_cost:cost?cost.value:"0"});});return{lines:lines};},validate:function(){var entered=Array.from(document.querySelectorAll("[data-proc-receipt-qty]")).filter(function(input){return Number(input.value||0)>0;});if(!entered.length)return"Enter a quantity received for at least one line.";for(var i=0;i<entered.length;i+=1){if(Number(entered[i].value)>Number(entered[i].getAttribute("data-proc-receipt-max")))return"A received quantity cannot exceed the outstanding amount.";}return"";}};}
async function recordReceipt(reference,known){var order=known;try{if(!order||!order.lines)order=await getOrder(reference);}catch(err){JONE.ui.toast((err&&err.message)||"The purchase order couldn't be loaded.","error");return;}var result=await JONE.dashboard.formModal({title:"Record goods receipt · "+reference,submitText:"Post receipt",wide:true,fields:[receiptField(order),{name:"received_on",label:"Received on",type:"date"},{name:"supplier_delivery_reference",label:"Supplier delivery reference",type:"text"},{name:"notes",label:"Receipt notes",type:"textarea",rows:2}],onSubmit:async function(values){values=OPS.omitEmpty(values);values.idempotency_key=OPS.newIdempotencyKey("goods-receipt");await window.API.resourceAction("purchaseOrders",reference,"receipts",values);return{message:"Goods receipt posted."};}});if(result){JONE.ui.toast("Goods receipt posted; stock balances are updated.","success");loadOrders();}}
function activate(tab){state.tab=tab;document.querySelectorAll("[data-proc-panel]").forEach(function(panel){panel.hidden=panel.getAttribute("data-proc-panel")!==tab;});document.querySelectorAll("[data-proc-tab]").forEach(function(button){var active=button.getAttribute("data-proc-tab")===tab;button.classList.toggle("is-active",active);button.classList.toggle("btn-outline",!active);button.setAttribute("aria-selected",active?"true":"false");});if(tab==="orders")loadOrders();if(tab==="suppliers")loadSuppliers();}
document.querySelectorAll("[data-proc-tab]").forEach(function(button){button.addEventListener("click",function(){activate(button.getAttribute("data-proc-tab"));});});document.querySelector("[data-proc-new-order]").addEventListener("click",newOrder);document.querySelector("[data-proc-order-apply]").addEventListener("click",function(){loadOrders(1);});document.getElementById("proc-order-status").addEventListener("change",function(){loadOrders(1);});document.querySelector("[data-proc-new-supplier]").addEventListener("click",newSupplier);document.querySelector("[data-proc-supplier-apply]").addEventListener("click",function(){loadSuppliers(1);});document.getElementById("proc-supplier-status").addEventListener("change",function(){loadSuppliers(1);});document.getElementById("proc-supplier-search").addEventListener("input",JONE.debounce(function(){loadSuppliers(1);},350));orderRows.addEventListener("click",function(event){var button=event.target.closest("button");if(button&&button.dataset.procOrderView)viewOrder(button.dataset.procOrderView);});supplierRows.addEventListener("click",function(event){var button=event.target.closest("button");if(button&&button.dataset.procSupplierEdit)editSupplier(button.dataset.procSupplierEdit);});loadOrders();
})();
</script><script src="../js/pwa.js?v=1.1.6"></script><script src="../js/version.js?v=1.1.6"></script><script src="../js/update-checker.js?v=1.1.6"></script></body></html>
