</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Facilities</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Facilities</h2><div class="panel-actions"><button class="btn btn-sm" data-fac-add>Add facility</button></div></div>
  <div class="panel-body">
    <div class="facility-grid" data-facility-grid></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/runtime-config.js?v=1.1.11"></script>
<script src="../js/config.js?v=1.1.11"></script>
<script src="../js/utils.js?v=1.1.11"></script>
<script src="../js/icons.js?v=1.1.11"></script>
<script src="../js/api.js?v=1.1.11"></script>
<script src="../js/theme.js?v=1.1.11"></script>
<script src="../js/ui.js?v=1.1.11"></script>
<script src="../js/auth.js?v=1.1.11"></script>
<script src="../js/hotel-data.js?v=1.1.11"></script>
<script src="../js/navigation.js?v=1.1.11"></script>
<script src="../js/dashboard.js?v=1.1.11"></script><script src="../js/table-fit.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var data=[];
  var grid=document.querySelector("[data-facility-grid]");

  function render(){
    grid.innerHTML=data.map(function(f){
      var id=f.id||f.slug||f.name;
      /* Verified /api/admin/facilities/ row: { id, name, slug, description,
         icon, image_url, is_active, display_order } */
      return '<div class="facility-item" style="flex-direction:column;">'+(f.image_url?'<img src="'+JONE.esc(f.image_url)+'" alt="" loading="lazy" style="width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:0.75rem;">':'')+'<div class="flex-between"><div class="facility-icon"><span data-icon="'+JONE.esc(f.icon||"building")+'" data-size="22"></span></div>'+JONE.dashboard.statusPill(f.is_active===false?"inactive":"active")+'</div><div><h4>'+JONE.esc(f.name||"—")+'</h4><p>'+JONE.esc(f.description||"")+'</p></div><div style="display:flex;gap:0.5rem;"><button class="btn btn-sm btn-outline" data-fac-edit="'+encodeURIComponent(id)+'" type="button"><span data-icon="edit" data-size="13"></span> Edit</button><button class="btn btn-sm btn-danger" data-fac-del="'+encodeURIComponent(id)+'" type="button"><span data-icon="trash" data-size="13"></span></button></div></div>';
    }).join("") || '<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No facilities yet</h3></div>';
    JONE.icons.inject(grid);
  }

  async function load(){
    grid.innerHTML='<div class="loading-block" style="grid-column:1/-1;"><div class="spinner" role="status"></div><p class="muted">Loading facilities&hellip;</p></div>';
    try{
      var res=await window.API.list("facilities");
      var list=window.API.normalizeList(res.data, res.pagination).items;
      data=list||[];
      if(!data.length){ grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No facilities yet</h3></div>'; return; }
      render();
    }catch(err){
      grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><span data-icon="alertTriangle" data-size="34"></span><h3>Facilities couldn\'t be loaded</h3><p>'+((err&&err.status===0&&err.message)||"Please try again in a moment.")+'</p></div>';
      JONE.icons.inject(grid);
    }
  }
  load();

  /* Verified write contract — FacilityAdminSerializer:
     multipart fields: name, description, icon, image (file, optional),
     is_active, display_order. image_url is read-only. */
  var ICON_KEYS=["building","wifi","coffee","utensils","bed","car","dumbbell","waves","sparkles","briefcase","heart","star","zap","users","maximize","clock","phone"];
  var ICONS=[{value:"",label:"building (default)"}].concat(ICON_KEYS.filter(function(k){return k!=="building";}).map(function(k){return {value:k,label:k};}));

  function facFields(f){
    return [
      { name:"name", label:"Name", required:true, value:f?f.name:"" },
      { name:"description", label:"Description", type:"textarea", rows:3, value:f?(f.description||""):"" },
      { name:"icon", label:"Icon key", type:"select", options:ICONS, value:f?(f.icon||""):"" },
      { name:"image", label:(f&&f.image_url)?"Replace image (optional)":"Image", type:"file", accept:"image/*" },
      { name:"display_order", label:"Display order", type:"number", value:f?(f.display_order||0):0 },
      { name:"is_active", label:"Active (visible to guests)", type:"checkbox", value:f?f.is_active:true }
    ];
  }

  async function openFacModal(f){
    var out=await JONE.dashboard.formModal({
      title: f?"Edit "+f.name:"Add facility",
      submitText: f?"Save changes":"Create facility",
      multipart: true,
      fields: facFields(f),
      onSubmit: function(v, fd){
        if(v.display_order==="") delete v.display_order;
        if(f) return window.API.update("facilities", f.id, fd).then(function(){ JONE.ui.toast("Facility saved.","success"); });
        return window.API.create("facilities", fd).then(function(){ JONE.ui.toast("Facility created.","success"); });
      }
    });
    if(out) load();
  }

  document.addEventListener("click",function(e){
    var del=e.target.closest("[data-fac-del]");
    if(del){
      var id=decodeURIComponent(del.getAttribute("data-fac-del"));
      var f=data.filter(function(x){ return String(x.id)===String(id); })[0];
      JONE.ui.confirm({title:"Remove this facility?",message:"The facility will be removed from the site.",confirmText:"Delete",danger:true}).then(async function(ok){
        if(!ok) return;
        try{
          await window.API.remove("facilities", id);
          JONE.ui.toast("Facility removed.","success");
          load();
        }catch(err){ JONE.ui.toast(err.message||"Couldn't remove this facility. Please try again.","error"); }
      });
    }
    var edit=e.target.closest("[data-fac-edit]");
    if(edit){
      var f2=data.filter(function(x){ return String(x.id)===String(decodeURIComponent(edit.getAttribute("data-fac-edit"))); })[0];
      if(f2) openFacModal(f2);
    }
    var add=e.target.closest("[data-fac-add]");
    if(add){ openFacModal(null); }
  });
})();

</script>
<script src="../js/pwa.js?v=1.1.11"></script>
<script src="../js/version.js?v=1.1.11"></script>
<script src="../js/update-checker.js?v=1.1.11"></script>
</body>
</html>
