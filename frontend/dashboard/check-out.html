/* Pre-paint theme (anti-flash): apply the stored/system theme BEFORE any content paints. */
(function(){try{var k="jone.theme";var s=window["local"+"Storage"];var raw=(s&&s.getItem(k))||null;var v=null;try{v=JSON.parse(raw);}catch(e){v=raw;}if(v!=="dark"&&v!=="light"){v=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",v);document.documentElement.style.colorScheme=v;}catch(e){}})();
</script>

<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">

      </span>

    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <script>
    /* Sidebar pre-paint: the menu is painted from this ROLE's cached snapshot
       during HTML parsing, so it is on screen with the page instead of
       rebuilding after the dashboard scripts boot. The snapshot is used only
       when the role it was rendered for is the role in this browser's stored
       session; anything else (no cache, another account, signed out) leaves the
       menu empty — the dashboard script then renders it properly. */
    (function(){
      var nav=document.querySelector("[data-dash-nav]");
      if(!nav)return;
      var role=null;
      try{
        var raw=window["local"+"Storage"].getItem("jone.auth");
        if(raw){var p=JSON.parse(raw)||{};var u=p.user||p;role=(u&&u.role)||p.role||null;if(role)role=String(role).toLowerCase();}
      }catch(e){role=null;}
      if(!role)return;
      var snap=null;
      try{snap=JSON.parse(window.sessionStorage.getItem("jone.dash.nav")||"null");}catch(e){snap=null;}
      if(!snap||snap.role!==role||typeof snap.html!=="string"||!snap.html)return;
      nav.innerHTML=snap.html;
      var here=location.pathname.split("/").pop()||"index.html";
      var items=nav.querySelectorAll("a.dash-nav-item");
      for(var i=0;i<items.length;i++){
        items[i].classList.remove("is-active");
        items[i].removeAttribute("aria-current");
        var href=(items[i].getAttribute("href")||"").split("?")[0].split("#")[0];
        if(href===here){items[i].classList.add("is-active");items[i].setAttribute("aria-current","page");}
      }
      nav.setAttribute("data-nav-snapshot","1");
    })();
    </script>

<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  "use strict";
  var DATA = JONE.dashboard.DATA;
  var results = document.querySelector("[data-co-results]");
  var summary = document.querySelector("[data-co-summary]");
  var input = document.getElementById("co-q");
  var clearBtn = document.getElementById("co-clear");
  var found = [];

  /* Verified /api/admin/bookings/ row (AdminBookingListSerializer):
     { id, booking_reference, guest_name, guest_phone, guest_email,
       room_type_name, room_numbers[], check_in, check_out, nights,
       number_of_rooms, number_of_guests, total_amount, amount_paid,
       amount_due, currency, status, payment_status, source, created_at }

     The checkout desk only ever needs bookings that CAN be checked out, so
     the server is asked for `status=CHECKED_IN,CONFIRMED` plus a `search`
     term — one small request per keystroke (debounced), never the whole
     table. Check-out itself is POST /api/admin/bookings/{ref}/check-out/ and
     needs { allow_balance_due: true } when a balance remains. */

  var DEBOUNCE_MS = 300;
  var requestSeq = 0;   // ignore out-of-order responses

  function refOf(b){ return b.booking_reference || b.id; }
  function roomLabel(b){ return (b.room_numbers && b.room_numbers.length) ? b.room_numbers.join(", ") : (b.room_type_name || "—"); }
  function nightsLabel(b){
    var n = b.nights != null ? b.nights : JONE.nightsBetween(b.check_in, b.check_out);
    return n ? n + (n === 1 ? " night" : " nights") : "—";
  }

  function moneyCell(label, value, cls){
    return '<div class="co-fact"><span class="co-fact-label">' + JONE.esc(label) + "</span>" +
      '<span class="co-fact-value num ' + (cls || "") + '">' + JONE.esc(JONE.formatNaira(value || 0)) + "</span></div>";
  }

  function card(b){
    /* The card must state what the guest ACTUALLY owes. The stay projection
       (amount_due) misses everything the guest consumed on top of the room and
       charged to their folio — food, drinks, room service, laundry — so a guest
       could show "Outstanding ₦0" at the desk while still owing the hotel money
       for their own requests. `outstanding_balance` is the authoritative figure
       (stay + posted folio charges) the folio and the ledger agree on; fall back
       to the stay projection only when the API did not send it. */
    var stayDue = Number(b.amount_due || 0);
    var folioCharges = Number(b.folio_charges || 0);
    var due = (b.outstanding_balance != null && b.outstanding_balance !== "")
      ? Number(b.outstanding_balance) : stayDue;
    var ref = refOf(b);
    var inHouse = String(b.status).toUpperCase() === "CHECKED_IN";
    var actions = inHouse
      ? '<button class="btn btn-block btn-accent" data-checkout-btn="' + JONE.esc(ref) + '"' +
        (due > 0 ? ' data-due="1" data-due-amount="' + JONE.esc(String(due)) + '"' : "") + '>' +
        '<span data-icon="logOut" data-size="16"></span> Check out' +
        (due > 0 ? " (balance " + JONE.esc(JONE.formatNaira(due)) + ")" : "") + "</button>"
      : '<button class="btn btn-block btn-outline" data-checkin-btn="' + JONE.esc(ref) + '">' +
        '<span data-icon="logOut" data-size="16"></span> Check in first</button>';
    return '<article class="co-card">' +
      '<header class="co-card-head">' +
        '<div class="co-card-who">' +
          '<h3>' + JONE.esc(b.guest_name || "Guest") + "</h3>" +
          '<p class="co-card-contact">' + JONE.esc([b.guest_phone, b.guest_email].filter(Boolean).join(" · ") || "—") + "</p>" +
        "</div>" +
        '<div class="co-card-tags">' +
          JONE.dashboard.statusPill(b.status) +
          JONE.dashboard.statusPill(b.payment_status) +
        "</div>" +
      "</header>" +
      '<dl class="co-card-facts">' +
        '<div class="co-fact"><span class="co-fact-label">Room</span><span class="co-fact-value">' +
          JONE.esc(roomLabel(b)) +
          (b.room_type_name ? '<span class="co-fact-sub">' + JONE.esc(b.room_type_name) + "</span>" : "") +
        "</span></div>" +
        '<div class="co-fact"><span class="co-fact-label">Booking ref</span><span class="co-fact-value">' +
          '<a href="booking-details.html?ref=' + encodeURIComponent(ref) + '">' + JONE.esc(ref) + "</a></span></div>" +
        '<div class="co-fact"><span class="co-fact-label">Check-in</span><span class="co-fact-value">' +
          JONE.esc(b.check_in ? JONE.formatDate(b.check_in, "mid") : "—") + "</span></div>" +
        '<div class="co-fact"><span class="co-fact-label">Check-out</span><span class="co-fact-value">' +
          JONE.esc(b.check_out ? JONE.formatDate(b.check_out, "mid") : "—") +
          '<span class="co-fact-sub">' + JONE.esc(nightsLabel(b)) + "</span></span></div>" +
      "</dl>" +
      '<div class="co-card-money">' +
        moneyCell("Total", b.total_amount) +
        moneyCell("Paid", b.amount_paid) +
        moneyCell("Outstanding", due, due > 0 ? "text-danger" : "text-success") +
      "</div>" +
      (folioCharges > 0
        ? '<p class="co-card-note caption">Includes ' + JONE.esc(JONE.formatNaira(folioCharges)) +
          " of purchases and guest requests charged to the folio — see View folio / gate pass.</p>"
        : "") +
      '<footer class="co-card-actions">' +
        actions +
        (canViewFolio()
          ? '<button class="btn btn-block btn-outline" data-folio-btn="' + JONE.esc(ref) + '">' +
            '<span data-icon="receipt" data-size="16"></span> View folio / gate pass</button>' : "") +
        /* Shared rule: no outstanding balance -> no Record payment button.
           (That dialog settles the STAY projection; money owed for the guest's
           own requests is collected in the folio, which is why a booking whose
           room is paid can still offer a settlement below.) */
        (JONE.dashboard.canRecordPayment(b)
          ? '<button class="btn btn-block btn-outline" data-pay-btn="' + JONE.esc(b.id) + '">' +
            '<span data-icon="wallet" data-size="16"></span> Record payment</button>' : "") +
        /* Money owed for the guest's requests: one place to collect it. */
        (folioCharges > 0 && inHouse
          ? '<button class="btn btn-block btn-accent" data-folio-btn="' + JONE.esc(ref) + '">' +
            '<span data-icon="wallet" data-size="16"></span> Settle requests &amp; print gate pass</button>' : "") +
        '<a class="btn btn-block btn-ghost" href="booking-details.html?ref=' + encodeURIComponent(ref) + '">' +
          '<span data-icon="fileText" data-size="16"></span> Full booking</a>' +
      "</footer>" +
    "</article>";
  }

  function canViewFolio(){
    return !!(window.Auth && window.Auth.hasAnyCapability && window.Auth.hasAnyCapability(["folio.view"]));
  }

  /* Folio & gate clearance: everything the guest consumed (food, drinks,
     snacks, laundry and other folio charges), what they paid, and whether a
     gate pass may be printed. All figures come from the backend folio read —
     the page never computes a balance itself.

     The bill is STATED, not hinted at: money owed for the guest's own requests
     (restaurant, bar, room service, laundry) is part of "amount to settle"
     even before it is billed to the folio, and the gate pass stays blocked
     until every naira is collected and recorded by the staff member who
     received it. That recording happens right here, so the figure the desk sees
     after taking the money is the ledger's figure, not an estimate. */
  async function openClearance(ref, booking){
    var body = JONE.el("div", { class: "loading-skeleton", textContent: "Loading folio…" });
    JONE.ui.modal.open({ title: "Folio & gate clearance · " + ref, body: body, size: "modal-lg" });
    if (!window.API || typeof window.API.bookingFolioClearance !== "function") {
      body.innerHTML = '<div class="empty-state"><h3>Update needed</h3><p>This screen is running an older copy of the app. Refresh the page (or accept the update prompt when it appears), then open the folio again.</p></div>';
      return;
    }
    try {
      var res = await window.API.bookingFolioClearance(ref);
      renderClearance(body, ref, res.data || {}, booking);
    } catch (err) {
      body.innerHTML = '<div class="empty-state"><h3>Folio unavailable</h3><p>' + JONE.esc((err && err.message) || "Please try again.") + "</p></div>";
    }
  }

  function clearanceRows(list, emptyText){
    if (!list.length) return '<p class="caption">' + JONE.esc(emptyText) + "</p>";
    return '<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>' +
      list.map(function(c){
        return '<tr><td>' + JONE.esc(c.date || "—") + '</td><td>' + JONE.esc(c.description || c.kind || "Charge") +
          (c.source_reference ? '<br><small>' + JONE.esc(c.source_reference) + "</small>" : "") +
          '</td><td class="num">' + JONE.esc(JONE.formatNaira(c.amount || 0)) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function billLine(label, amount, help){
    return '<div class="folio-bill-line"><span>' + JONE.esc(label) +
      (help ? '<br><small class="muted">' + JONE.esc(help) + "</small>" : "") +
      '</span><strong>' + JONE.esc(JONE.formatNaira(amount || 0)) + "</strong></div>";
  }

  function renderClearance(body, ref, d, booking){
    var charges = d.charges || [];
    var credits = d.credits || [];
    var unpaid = d.unpaid_requests || [];
    var openReq = d.open_requests || [];
    var blockers = d.gate_pass_blockers || [];
    var acc = d.accommodation || {};
    var toSettle = Number(d.amount_to_settle || 0);

    var html = '<dl class="profile-grid">' +
      '<div><dt>Guest</dt><dd>' + JONE.esc(d.guest_name || "Guest") + "</dd></div>" +
      '<div><dt>Room</dt><dd>' + JONE.esc((d.room_numbers || []).join(", ") || "—") + "</dd></div>" +
      '<div><dt>Stay</dt><dd>' + JONE.esc([d.check_in, d.check_out].filter(Boolean).join(" → ") || "—") + "</dd></div>" +
      '<div><dt>Status</dt><dd>' + JONE.dashboard.statusPill(d.status || "") + "</dd></div></dl>" +

      /* ---------------------------- the bill ---------------------------- */
      '<h4 style="margin:1rem 0 .5rem;">Bill to settle</h4>' +
      '<div class="folio-bill">' +
        billLine("Accommodation balance", acc.amount_due, "Room total " + JONE.formatNaira(acc.total_amount || 0) + " · paid " + JONE.formatNaira(acc.amount_paid || 0)) +
        billLine("Purchases & charges on the folio", d.folio_balance) +
        billLine("Requests not yet paid for", d.unpaid_requests_total, "Received by the guest but not billed to the folio yet") +
        '<div class="folio-bill-total"><span>Amount to settle</span><strong>' + JONE.esc(JONE.formatNaira(toSettle)) + "</strong></div>" +
      "</div>" +

      /* --------------------------- itemisation -------------------------- */
      '<h4 style="margin:1rem 0 .5rem;">Purchases &amp; charges (food, drinks, laundry, extras)</h4>' +
      clearanceRows(charges, "No extra purchases were charged to this guest.") +
      (credits.length ? '<h4 style="margin:1rem 0 .5rem;">Payments &amp; credits on the folio</h4>' + clearanceRows(credits, "") : "") +

      /* --------------- money owed for the guest's own requests ----------- */
      (unpaid.length ?
        '<h4 style="margin:1rem 0 .5rem;">Requests not yet paid for</h4>' +
        '<div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Item</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>' +
        unpaid.map(function(r){
          return "<tr><td>" + JONE.esc(r.reference) + "</td><td>" + JONE.esc(r.description || r.kind) +
            '</td><td class="num">' + JONE.esc(JONE.formatNaira(r.amount || 0)) + "</td><td>" + JONE.esc(r.status || "—") + "</td></tr>";
        }).join("") + "</tbody></table></div>" +
        '<p class="caption">These are part of the amount to settle above. Recording the payment bills them to the folio and settles them in one step — nothing is billed twice.</p>'
        : "") +

      (openReq.length ?
        '<h4 style="margin:1rem 0 .5rem;">Guest requests still open</h4>' +
        '<ul class="caption" style="margin:0 0 0 1rem;">' +
        openReq.map(function(r){ return "<li>" + JONE.esc(r.summary || r.reference) + " (" + JONE.esc(r.status || "") + ")</li>"; }).join("") +
        '</ul><p class="caption">Confirm each request is fulfilled — or close it — before the guest leaves.</p>'
        : "");

    /* ---------------------- the gate-pass decision ---------------------- */
    if (d.gate_pass_allowed) {
      html += '<p class="text-success" style="margin-top:1rem;"><strong>All bills cleared and no request is outstanding.</strong> You may print the gate pass, then complete check-out.</p>' +
        '<button class="btn btn-accent" type="button" data-print-gate-pass="' + JONE.esc(d.booking_reference || ref) + '">' +
        '<span data-icon="printer" data-size="16"></span> Print gate clearance receipt</button>';
    } else {
      html += '<div class="folio-blocked"><p class="text-danger" style="margin:0 0 .35rem;"><strong>Do not issue a gate pass yet.</strong></p><ul style="margin:0 0 0 1rem;">' +
        blockers.map(function(b){
          return "<li>" + JONE.esc(b.label) + (b.amount ? " — " + JONE.esc(JONE.formatNaira(b.amount)) : "") +
            (b.count ? " (" + JONE.esc(String(b.count)) + ")" : "") + "</li>";
        }).join("") +
        "</ul></div>";
    }

    /* ------------- record the money the desk just received --------------- */
    if (d.can_settle) {
      html += '<h4 style="margin:1.25rem 0 .5rem;">Record the payment received</h4>' +
        '<div class="folio-settle">' +
          '<p class="caption" style="margin:0 0 .5rem;">Enter exactly what the guest handed over. It is recorded against your account and applied to the folio immediately' +
            (unpaid.length ? " (the unpaid requests above are billed to the folio in the same step)" : "") + ".</p>" +
          '<div class="field"><label class="field-label" for="co-settle-amount">Amount received</label>' +
            '<input class="input" id="co-settle-amount" type="number" min="0.01" step="0.01" value="' + JONE.esc(String(toSettle.toFixed(2))) + '"></div>' +
          '<div class="field"><label class="field-label" for="co-settle-method">How the guest paid</label>' +
            '<select class="select" id="co-settle-method">' +
              '<option value="CASH">Cash at reception</option>' +
              '<option value="POS">POS / card terminal</option>' +
              '<option value="BANK_TRANSFER">Bank transfer</option>' +
            "</select></div>" +
          '<div class="field"><label class="field-label" for="co-settle-drawer">Cash session reference (cash only)</label>' +
            '<input class="input" id="co-settle-drawer" type="text" maxlength="64" placeholder="Your own open drawer" autocomplete="off"></div>' +
          '<div class="field"><label class="field-label" for="co-settle-notes">Notes (optional)</label>' +
            '<input class="input" id="co-settle-notes" type="text" maxlength="255" placeholder="e.g. settled at the desk, receipt issued"></div>' +
          '<button class="btn btn-accent" type="button" data-settle-balance="' + JONE.esc(d.booking_reference || ref) + '">' +
            '<span data-icon="wallet" data-size="16"></span> Record payment &amp; clear the folio</button>' +
          '<p class="caption" data-settle-status aria-live="polite" style="margin:.5rem 0 0;"></p>' +
        "</div>";
    } else if (blockers.length) {
      html += '<p class="caption" style="margin-top:1rem;">' + JONE.esc(d.settle_blocked_reason || "") + "</p>";
    }

    body.innerHTML = html;
    JONE.icons.inject(body);

    var printBtn = body.querySelector("[data-print-gate-pass]");
    if (printBtn) printBtn.addEventListener("click", function(){ printGatePass(d); });
    var settleBtn = body.querySelector("[data-settle-balance]");
    if (settleBtn) settleBtn.addEventListener("click", function(){ recordSettlement(body, ref, d, booking, settleBtn); });
  }

  /* Record the money received at the desk for the WHOLE bill (stay + the
     guest's requests) and re-render from the backend's refreshed folio read.
     The response is the authority: the dialog never does the arithmetic. */
  async function recordSettlement(body, ref, d, booking, button){
    var statusEl = body.querySelector("[data-settle-status]");
    var amountEl = body.querySelector("#co-settle-amount");
    var methodEl = body.querySelector("#co-settle-method");
    var drawerEl = body.querySelector("#co-settle-drawer");
    var notesEl = body.querySelector("#co-settle-notes");
    var amount = Number(amountEl && amountEl.value);
    var method = (methodEl && methodEl.value) || "CASH";
    var drawer = String((drawerEl && drawerEl.value) || "").trim();
    function say(text){
      if (statusEl) statusEl.textContent = text;
    }
    if (!Number.isFinite(amount) || amount <= 0) { say("Enter the amount the guest actually handed over."); amountEl && amountEl.focus(); return; }
    if (method === "CASH" && !drawer) { say("Cash must go into your own open drawer — enter its cash-session reference."); drawerEl && drawerEl.focus(); return; }
    if (method !== "CASH" && drawer) { say("Remove the cash-session reference for a POS or bank transfer."); return; }
    button.disabled = true;
    say("Recording the payment…");
    try {
      var res = await window.API.settleBookingBalance(ref, {
        amount: amount.toFixed(2),
        provider: method,
        notes: (notesEl && notesEl.value) || "",
        include_unbilled: true,
        cash_session_reference: method === "CASH" ? drawer : ""
      });
      var payload = (res && res.data) || {};
      var folio = payload.folio || {};
      JONE.ui.toast("Payment " + (payload.receipt_reference || "") + " recorded by " + (payload.recorded_by || "you") + ".", "success");
      if (folio.gate_pass_allowed) {
        JONE.ui.toast("The bill is settled in full — the gate pass may be printed.", "success");
      }
      renderClearance(body, ref, folio, booking);
      if (typeof load === "function") await load(input ? input.value.trim() : "");
    } catch (err) {
      button.disabled = false;
      say((err && err.message) || "The payment could not be recorded. Nothing was charged.");
      JONE.ui.toast((err && err.message) || "The payment could not be recorded.", "error");
    }
  }

  /* The gate pass is a POS thermal receipt (same module, paper widths and
     style as the restaurant/bar receipts): every purchase, proof of full
     settlement, and the all-bills-cleared note for the gate. */
  async function printGatePass(d){
    if (!window.JONE || !JONE.ThermalReceipt) { JONE.ui.toast("Thermal receipt module unavailable.", "error"); return; }
    var widthResult = await JONE.dashboard.formModal({ title: "Gate clearance receipt · " + JONE.esc(d.booking_reference || ""), submitText: "Print", fields: [{ name: "width", label: "Paper width", type: "select", required: true, value: JONE.ThermalReceipt.getWidth(), options: [{ value: "80", label: "80 mm thermal roll" }, { value: "58", label: "58 mm thermal roll" }] }], onSubmit: async function(values){ JONE.ThermalReceipt.setWidth(values.width); return { message: "Preparing receipt…" }; } });
    if (!widthResult) return;
    var acc = d.accommodation || {};
    var items = [{ name: "Accommodation — Room " + ((d.room_numbers || []).join(", ") || "—") + " (" + (d.booking_reference || "") + ")", quantity: 1, unit_price: acc.total_amount, line_total: acc.total_amount }];
    (d.charges || []).forEach(function(c){ items.push({ name: (c.description || c.kind || "Charge") + (c.date ? " · " + c.date : ""), quantity: 1, unit_price: c.amount, line_total: c.amount }); });
    var discount = (d.credits || []).filter(function(c){ return c.kind === "DISCOUNT"; }).reduce(function(sum, c){ return sum + Number(c.amount || 0); }, 0);
    var subtotal = items.reduce(function(sum, item){ return sum + Number(item.line_total || 0); }, 0);
    var total = Math.max(0, subtotal - discount);
    var email = (window.Auth && window.Auth.state && window.Auth.state.user && window.Auth.state.user.email) || "";
    var receipt = {
      hotel: { name: "J-ONE HOTEL & LODGE", address: "Plot 566 Mgbowo Street, off Ezike Street, Enugu State", phone: "+234 803 211 2874" },
      reference: d.booking_reference || "",
      issued_at: new Date().toISOString(),
      cashier: email,
      mode: "GATE CLEARANCE PASS",
      items: items,
      subtotal: subtotal,
      discount: discount,
      total: total,
      paid: total,
      balance_due: 0,
      payment_method: "Settled in full",
      note: "ALL BILLS CLEARED — this guest is not owing the hotel. Please allow exit at the gate."
    };
    JONE.ThermalReceipt.print(receipt, { width: JONE.ThermalReceipt.getWidth() });
  }

  function renderList(list, term){
    found = list || [];
    if (!found.length) {
      results.innerHTML = '<div class="empty-state" style="margin:1rem;">' +
        '<span data-icon="search" data-size="34"></span><h3>No guest matches “' + JONE.esc(term || "") + '”</h3>' +
        "<p>Check the room number, booking reference, guest name, phone or email and try again.</p></div>";
      JONE.icons.inject(results);
      if (summary) summary.textContent = "";
      return;
    }
    results.innerHTML = '<div class="co-grid">' + found.map(card).join("") + "</div>";
    JONE.icons.inject(results);
    if (summary) {
      summary.textContent = found.length + (found.length === 1 ? " guest" : " guests") +
        (term ? ' matching “' + term + '”' : " in-house or arriving");
    }
  }

  function serverSearch(term){
    // One targeted request; the backend does the matching.
    return term
      ? window.API.searchCheckout(term.trim())
      : window.API.list("bookings", { status: "CHECKED_IN", ordering: "check_out", page_size: 25 });
  }

  async function load(term){
    var seq = ++requestSeq;
    results.innerHTML = '<div class="loading-block"><div class="spinner" role="status"></div>' +
      '<p class="muted">Searching…</p></div>';
    try {
      var res = await serverSearch(term);
      if (seq !== requestSeq) return;              // a newer search superseded this one
      var list = window.API.normalizeList
        ? window.API.normalizeList(res.data, res.pagination).items
        : ((res.data && res.data.results) || res.data || []);
      renderList(list, term);
    } catch (err) {
      if (seq !== requestSeq) return;
      DATA.error(results, "Search failed", (err && err.message) || "Please try again in a moment.", 1, false);
    }
  }

  var searchTimer = null;

  if (input) {
    input.addEventListener("input", function(){
      if (clearBtn) clearBtn.hidden = !input.value;
      if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
      if (!input.value.trim()) { load(""); return; }
      searchTimer = setTimeout(function(){ searchTimer = null; load(input ? input.value.trim() : ""); }, DEBOUNCE_MS);
    });
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter") {
        e.preventDefault();
        if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
        load(input.value.trim());
      }
    });
    // A room number or booking reference handed over from another page (?q=203 or ?ref=J1-...) runs immediately.
    var urlParams = new URLSearchParams(location.search);
    var pre = (urlParams.get("q") || urlParams.get("ref") || urlParams.get("reference") || "").trim();
    if (pre) { input.value = pre; if (clearBtn) clearBtn.hidden = false; }
    load(pre || "");
  }
  if (clearBtn) clearBtn.addEventListener("click", function(){
    if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
    if (input) input.value = "";
    clearBtn.hidden = true;
    if (input) input.focus();
    load("");
  });

  /* ------------------------------- Actions ------------------------------- */
  document.addEventListener("click", async function(e){
    var payBtn = e.target.closest && e.target.closest("[data-pay-btn]");
    if (payBtn) {
      if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
      var booking = null;
      for (var i = 0; i < found.length; i++) if (String(found[i].id) === String(payBtn.getAttribute("data-pay-btn"))) booking = found[i];
      if (!booking) return;
      JONE.dashboard.paymentModal(booking, {
        onRecorded: function(){ load(input ? input.value.trim() : ""); }
      });
      return;
    }

    var folioBtn = e.target.closest && e.target.closest("[data-folio-btn]");
    if (folioBtn) {
      if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
      var folioRef = folioBtn.getAttribute("data-folio-btn");
      var folioBooking = null;
      for (var j = 0; j < found.length; j++) if (String(found[j].booking_reference) === String(folioRef)) folioBooking = found[j];
      openClearance(folioRef, folioBooking);
      return;
    }

    var inBtn = e.target.closest && e.target.closest("[data-checkin-btn]");
    if (inBtn) {
      if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
      var inRef = inBtn.getAttribute("data-checkin-btn");
      if (!JONE.guardSubmit(inBtn)) return;
      try {
        inBtn.disabled = true;
        await window.API.checkInBooking(inRef);
        JONE.ui.toast("Guest checked in (" + inRef + ").", "success");
        await load(input ? input.value.trim() : "");
      } catch (err) {
        JONE.ui.toast((err && err.message) || "Couldn't check this guest in.", "error");
      } finally {
        inBtn.disabled = false;
        JONE.releaseGuard(inBtn);
      }
      return;
    }

    var btn = e.target.closest && e.target.closest("[data-checkout-btn]");
    if (!btn) return;
    if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
    var ref = btn.getAttribute("data-checkout-btn");
    var hasDue = btn.getAttribute("data-due") === "1";
    if (hasDue) {
      var ok = await JONE.ui.confirm({
        title: "Check out with an outstanding balance?",
        message: "This booking still owes " + JONE.formatNaira(Number(btn.getAttribute("data-due-amount") || 0)) +
          " — room balance and/or unpaid guest requests on the folio. It stays on the record and can be settled separately, " +
          "but the gate pass cannot be issued until it is cleared.",
        confirmText: "Check out anyway", danger: true,
      });
      if (!ok) return;
    }
    if (!JONE.guardSubmit(btn)) return;
    try {
      btn.disabled = true;
      await window.API.checkOutBooking(ref, hasDue ? { allow_balance_due: true } : {});
      JONE.ui.toast("Guest checked out (" + ref + ").", "success");
      await load(input ? input.value.trim() : "");
    } catch (err) {
      JONE.ui.toast((err && err.message) || "Couldn't check out this guest. Please try again.", "error");
    } finally {
      btn.disabled = false;
      JONE.releaseGuard(btn);
    }
  });
})();

</script>
