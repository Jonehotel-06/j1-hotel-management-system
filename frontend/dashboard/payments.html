<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
/* Pre-paint theme (anti-flash): apply the stored/system theme BEFORE any content paints. */
(function(){try{var k="jone.theme";var s=window["local"+"Storage"];var raw=(s&&s.getItem(k))||null;var v=null;try{v=JSON.parse(raw);}catch(e){v=raw;}if(v!=="dark"&&v!=="light"){v=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",v);document.documentElement.style.colorScheme=v;}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Payments | J-ONE Staff</title>
<meta name="theme-color" content="#373435">
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <script>
    /* Sidebar pre-paint: the menu is painted from this ROLE's cached snapshot
       during HTML parsing, so it is on screen with the page instead of
       rebuilding after the dashboard scripts boot. The snapshot is used only
       when the role it was rendered for is the role in this browser's stored
       session; anything else (no cache, another account, signed out) leaves the
       menu empty — the dashboard script then renders it properly. */
    (function(){
      var nav=document.querySelector("[data-dash-nav]");
      if(!nav)return;
      var role=null;
      try{
        var raw=window["local"+"Storage"].getItem("jone.auth");
        if(raw){var p=JSON.parse(raw)||{};var u=p.user||p;role=(u&&u.role)||p.role||null;if(role)role=String(role).toLowerCase();}
      }catch(e){role=null;}
      if(!role)return;
      var snap=null;
      try{snap=JSON.parse(window.sessionStorage.getItem("jone.dash.nav")||"null");}catch(e){snap=null;}
      if(!snap||snap.role!==role||typeof snap.html!=="string"||!snap.html)return;
      nav.innerHTML=snap.html;
      var here=location.pathname.split("/").pop()||"index.html";
      var items=nav.querySelectorAll("a.dash-nav-item");
      for(var i=0;i<items.length;i++){
        items[i].classList.remove("is-active");
        items[i].removeAttribute("aria-current");
        var href=(items[i].getAttribute("href")||"").split("?")[0].split("#")[0];
        if(href===here){items[i].classList.add("is-active");items[i].setAttribute("aria-current","page");}
      }
      nav.setAttribute("data-nav-snapshot","1");
    })();
    </script>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Payments</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </header>
    <main class="dash-content">

<!-- The acting cashier's own drawer. Cash recorded from this screen must land
     in an open session belonging to the person taking it, so the drawer has to
     be openable here. -->
<section class="panel" data-desk-cash-panel hidden>
  <div class="panel-head">
    <h2>Your cash drawer</h2>
    <div class="panel-actions"><button class="btn btn-sm btn-outline" type="button" data-desk-cash-refresh>Refresh</button></div>
  </div>
  <div class="panel-body" data-desk-cash-banner></div>
</section>

<section class="panel">
  <div class="filter-bar">
    <div class="field"><label class="field-label" for="p-q">Search</label><input class="input" id="p-q" placeholder="Reference, booking, guest"></div>
    <div class="field"><label class="field-label" for="p-method">Method</label><select class="select" id="p-method"><option value="">All</option><option value="PAYSTACK">Paystack</option><option value="CASH">Cash</option><option value="POS">POS</option><option value="BANK_TRANSFER">Bank transfer</option></select></div>
    <div class="field"><label class="field-label" for="p-status">Status</label><select class="select" id="p-status"><option value="">All</option><option value="SUCCESS">Success</option><option value="PENDING">Pending</option><option value="FAILED">Failed</option><option value="PARTIALLY_REFUNDED">Partially refunded</option><option value="REFUNDED">Refunded</option></select></div>
    <div class="field"><button class="btn btn-sm" id="p-apply" type="button">Apply</button></div>
  </div>

  <details class="panel" data-record-payment-panel hidden style="border:1px solid var(--color-border);margin-bottom:1.25rem;">
    <summary style="padding:0.85rem 1.1rem;cursor:pointer;font-weight:600;">Record offline payment (cash / POS / transfer)</summary>
    <div class="panel-body">
      <form id="record-payment-form" class="filter-bar" style="flex-wrap:wrap;">
        <div class="field" style="min-width:200px;"><label class="field-label" for="rp-booking">Booking reference</label><input class="input" id="rp-booking" required placeholder="J1-…"></div>
        <div class="field" style="min-width:140px;"><label class="field-label" for="rp-amount">Amount (₦)</label><input class="input" id="rp-amount" type="number" min="100" step="0.01" required></div>
        <div class="field"><label class="field-label" for="rp-provider">Method</label><select class="select" id="rp-provider" required><option value="CASH">Cash</option><option value="POS">POS</option><option value="BANK_TRANSFER">Bank transfer</option></select></div>
        <!-- Cash must name the drawer it went into; POS / transfer must name the
             actual slip. Without these the server cannot apply the money to the
             guest's folio charges, which is the whole point of the form. -->
        <div class="field" id="rp-cash-field" style="min-width:210px;"><label class="field-label" for="rp-cash">Your cash session</label><input class="input" id="rp-cash" maxlength="64" autocomplete="off" data-desk-cash-prefill><small class="caption" data-desk-cash-hint></small></div>
        <div class="field" id="rp-external-field" style="min-width:210px;" hidden><label class="field-label" for="rp-external">Terminal / bank reference</label><input class="input" id="rp-external" maxlength="160" autocomplete="off" placeholder="Slip number"></div>
        <div class="field" style="min-width:220px;"><label class="field-label" for="rp-notes">Notes</label><input class="input" id="rp-notes" placeholder="Optional"></div>
        <div class="field" style="align-self:flex-end;"><button class="btn btn-accent" type="submit">Record payment</button></div>
      </form>
      <div class="field-error" data-record-error style="display:none;margin-top:0.5rem;"></div>
    </div>
  </details>
  <div class="panel-body no-pad">
    <div class="table-wrap table-scroll-x" tabindex="0" role="region" aria-label="Payments table, scroll sideways to see every column"><table class="table table-payments">
      <thead><tr><th>Payment ref</th><th>Booking</th><th class="hide-sm">Guest</th><th>Method</th><th class="hide-sm">Date</th><th>Amount</th><th>Status</th><th class="hide-sm">By</th><th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody data-tbody="payments"></tbody>
    </table></div>
    <div class="pagination" data-pay-pagination></div>
  </div>
</section>
<section class="panel" style="margin-top:1.25rem;">
  <div class="panel-head"><h2>Refund lifecycle</h2><div class="panel-actions"><select class="select" id="r-status" style="min-width:170px;font-size:var(--fs-sm);padding:0.5em 0.8em;" aria-label="Refund status"><option value="">All refunds</option><option value="PENDING">Pending</option><option value="PROCESSING">Processing</option><option value="PROCESSED">Processed</option><option value="FAILED">Failed</option><option value="NEEDS_ATTENTION">Needs attention</option></select></div></div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Refund</th><th>Booking</th><th>Payment ref</th><th>Amount</th><th>Status</th><th class="hide-sm">Submitted</th><th class="hide-sm">Paystack refund</th></tr></thead>
      <tbody data-tbody="refunds"></tbody>
    </table></div>
    <div class="pagination" data-refund-pagination></div>
  </div>
</section>

<script src="../js/utils.js?v=1.1.23"></script>
<script src="../js/icons.js?v=1.1.23"></script>
<script src="../js/api.js?v=1.1.23"></script>
<script src="../js/theme.js?v=1.1.23"></script>
<script src="../js/ui.js?v=1.1.23"></script>
<script src="../js/auth.js?v=1.1.23"></script>
<script src="../js/hotel-data.js?v=1.1.23"></script>
<script src="../js/navigation.js?v=1.1.23"></script>
<script src="../js/dashboard.js?v=1.1.23"></script><script src="../js/table-fit.js?v=1.1.23"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot(["admin", "general_manager", "receptionist", "accountant"]);
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });
  var paymentCapabilitiesReady = window.Auth && typeof window.Auth.loadCapabilities === "function"
    ? window.Auth.loadCapabilities().catch(function(){ return []; })
    : Promise.resolve([]);

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=payments]");
  /* A booking reference is a link to the booking screen. Both halves must
     agree: the viewer's department may open that page (the access registry in
     js/dashboard.js) AND the server grants them booking data — an accountant
     reading payroll-grade payment rows must not be handed a booking link the
     booking API would refuse. */
  function canOpenBookingReference(){
    return !!(window.Auth && window.Auth.hasCapability &&
      window.JONE && window.JONE.dashboard && window.JONE.dashboard.canOpenPage &&
      window.JONE.dashboard.canOpenPage("booking-details.html") &&
      (window.Auth.hasCapability("booking.read") || window.Auth.hasCapability("booking.manage")));
  }

  /* Verified /api/admin/payments/ row:
     { id, reference, booking_reference, guest_name, staff_email, provider,
       amount, currency, status, channel, gateway_response, transaction_id,
       paid_at, notes, created_at } — filters: status, provider, date_from,
       date_to, paid_on, search. */
  function render(list){
    if(!list.length){ tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><span data-icon="creditCard"></span><h3>No payments found</h3><p>No payments match the current filters.</p></div></td></tr>'; JONE.icons.inject(tbody); return; }
    tbody.innerHTML=list.map(function(p){
      var b=p.booking_reference;
      /* The guest name column is hidden on phones, so the name is repeated
         under the payment reference (.pay-mobile-guest, mobile-only) — a
         payment row is meaningless without knowing WHO paid. */
      var guest = p.guest_name || "";
      return '<tr>' +
        '<td class="cell-nowrap">' + JONE.esc(p.reference || "—") +
          (guest ? '<span class="pay-mobile-guest hide-md">' + JONE.esc(guest) + '</span>' : '') +
        '</td>' +
        '<td class="cell-nowrap">' + (b ? (canOpenBookingReference() ? '<a href="booking-details.html?ref=' + encodeURIComponent(b) + '">' + JONE.esc(b) + '</a>' : JONE.esc(b)) : "—") + '</td>' +
        '<td class="hide-sm">' + JONE.esc(guest || "—") + '</td>' +
        '<td class="cell-nowrap">' + JONE.esc(String(p.provider || "—").toLowerCase().replace(/_/g, " ")) + '</td>' +
        '<td class="hide-sm cell-nowrap">' + JONE.esc(p.paid_at ? JONE.formatDate(p.paid_at, "mid") : "—") + '</td>' +
        '<td class="num cell-nowrap">' + JONE.esc(JONE.formatNaira(p.amount)) + '</td>' +
        '<td class="cell-nowrap">' + JONE.dashboard.statusPill(p.status) + '</td>' +
        '<td class="hide-sm">' + JONE.esc(p.staff_email || "—") + '</td>' +
        '<td class="cell-nowrap">' +
          '<button class="btn btn-sm btn-outline" type="button" data-pay-view="' + JONE.esc(p.id) + '">' +
            '<span data-icon="eye" data-size="13"></span> View</button>' +
        '</td></tr>';
    }).join("");
    JONE.icons.inject(tbody);
  }

  /* Server-side pagination: the page is the ONLY list state; filters are read
     from the inputs on every request, so paging preserves them and any filter
     change restarts at page 1. */
  var state={ page:1 };
  var rowsById = {};
  var pager=document.querySelector("[data-pay-pagination]");
  function renderPager(meta){ JONE.dashboard.renderPagination(pager, meta, { onPage: load }); }

  function filters(){
    var f={ page: state.page, page_size: JONE.dashboard.pageSize() };
    var q=document.getElementById("p-q"); if(q&&q.value.trim()) f.search=q.value.trim();
    var m=document.getElementById("p-method"); if(m&&m.value) f.provider=m.value;
    var s=document.getElementById("p-status"); if(s&&s.value) f.status=s.value;
    return f;
  }

  async function load(page){
    if(page!=null) state.page=Math.max(1,page);
    DATA.loading(tbody);
    try{
      var res=await window.API.list("payments",filters());
      var norm=window.API.normalizeList(res.data,res.pagination);
      var list=norm.items||((res.data&&res.data.results)||[]);
      rowsById = {};
      (list || []).forEach(function (row) { rowsById[String(row.id)] = row; });
      render(list||[]);
      renderPager(list.length?res.pagination:null);
    }catch(err){ DATA.error(tbody,"Payments couldn't be loaded",(err&&err.message)||"Please try again in a moment.",9); }
  }

  /* View opens the full payment record in the shared side panel. Everything
     shown comes from the row the backend already returned plus a detail fetch
     for anything the list omits — no card data is stored or displayed. */
  tbody.addEventListener("click", async function (e) {
    var btn = e.target.closest && e.target.closest("[data-pay-view]");
    if (!btn) return;
    var id = btn.getAttribute("data-pay-view");
    var row = rowsById[String(id)] || null;
    JONE.dashboard.paymentDetailPanel(id, row);
  });

  var refundBody=document.querySelector("[data-tbody=refunds]");
  function renderRefunds(list){
    if(!refundBody) return;
    if(!list.length){ refundBody.innerHTML='<tr><td colspan="7"><div class="empty-state"><span data-icon="rotateCcw"></span><h3>No refunds</h3><p>Paystack refund attempts appear here after staff submit an approved cancellation refund.</p></div></td></tr>'; JONE.icons.inject(refundBody); return; }
    refundBody.innerHTML=list.map(function(r){
      var b=r.booking_reference;
      var bookingCell=b?(canOpenBookingReference()?'<a href="booking-details.html?ref='+encodeURIComponent(b)+'">'+JONE.esc(b)+'</a>':JONE.esc(b)):"—";
      return '<tr><td class="cell-nowrap">#'+JONE.esc(r.id||"—")+'</td><td class="cell-nowrap">'+bookingCell+'</td><td class="cell-nowrap">'+JONE.esc(r.payment_reference||"—")+'</td><td class="num cell-nowrap">'+JONE.esc(JONE.formatNaira(r.amount))+'</td><td class="cell-nowrap">'+JONE.dashboard.statusPill(r.status)+'</td><td class="hide-sm cell-nowrap">'+JONE.esc(r.submitted_at?JONE.formatDateTime(r.submitted_at):"—")+'</td><td class="hide-sm cell-nowrap">'+JONE.esc(r.paystack_refund_reference||r.paystack_refund_id||"Awaiting Paystack")+'</td></tr>';
    }).join("");
  }
  var refundPagerEl=document.querySelector("[data-refund-pagination]");
  function renderRefundPager(meta){ JONE.dashboard.renderPagination(refundPagerEl, meta, { onPage: loadRefunds }); }
  var refundState={ page:1 };
  async function loadRefunds(page){
    if(!refundBody) return;
    if(page!=null) refundState.page=Math.max(1,page);
    DATA.loading(refundBody);
    try{
      var params={ page: refundState.page, page_size: JONE.dashboard.pageSize() };
      var rs=document.getElementById("r-status"); if(rs&&rs.value) params.status=rs.value;
      var res=await window.API.listRefunds(params);
      var list=window.API.normalizeList?window.API.normalizeList(res.data,res.pagination).items:((res.data&&res.data.results)||res.data||[]);
      renderRefunds(list||[]);
      renderRefundPager(list.length?res.pagination:null);
    }catch(err){ DATA.error(refundBody,"Refunds couldn't be loaded",(err&&err.message)||"Please try again in a moment.",7); }
  }

  var applyBtn=document.getElementById("p-apply");
  if(applyBtn) applyBtn.addEventListener("click",function(){ load(1); });
  var refundStatus=document.getElementById("r-status"); if(refundStatus) refundStatus.addEventListener("change",function(){ loadRefunds(1); });
  var qEl=document.getElementById("p-q");
  if(qEl) qEl.addEventListener("input",JONE.debounce(function(){ load(1); },300));

  // Prefill the booking reference when handed off from a booking (?bookings=).
  (function(){
    var pre=new URLSearchParams(location.search).get("booking");
    if(pre){ var el=document.getElementById("rp-booking"); if(el&&!el.value) el.value=pre; }
  })();

  /* The desk's own drawer, and the cash / slip evidence the API requires.
     ``idempotency_key`` is minted per attempt so a retry after a dropped
     connection returns the payment already held instead of taking money twice. */
  var DESK = window.JONE && window.JONE.dashboard && window.JONE.dashboard.deskCash;
  var providerEl=document.getElementById("rp-provider");
  var cashField=document.getElementById("rp-cash-field");
  var cashEl=document.getElementById("rp-cash");
  var externalField=document.getElementById("rp-external-field");
  var externalEl=document.getElementById("rp-external");

  /* Show only the evidence the chosen method needs, and fill the drawer from
     the session the cashier actually has open rather than from typing. */
  function syncEvidence(){
    var isCash=!!providerEl&&providerEl.value==="CASH";
    if(cashField) cashField.hidden=!isCash;
    if(externalField) externalField.hidden=isCash;
    if(isCash){
      var session=DESK&&DESK.session&&DESK.session();
      if(DESK&&cashEl) DESK.prefill(document);
      var hint=document.querySelector("[data-desk-cash-hint]");
      if(hint){
        hint.textContent=session&&session.reference
          ? "Your open drawer \u00b7 expected cash "+JONE.formatNaira(session.expected_cash||0)+"."
          : "You have no open drawer. Open one in the panel above before taking cash.";
      }
    }
  }
  if(providerEl) providerEl.addEventListener("change",syncEvidence);

  if(DESK){
    (function mountDrawer(){
      var panel=document.querySelector("[data-desk-cash-panel]");
      var banner=document.querySelector("[data-desk-cash-banner]");
      var refreshBtn=document.querySelector("[data-desk-cash-refresh]");
      if(!panel||!banner) return;
      var opts={note:"Cash recorded here is added to this drawer."};
      function paint(){ DESK.renderBanner(banner,opts); syncEvidence(); }
      function start(){
        if(!DESK.canOpen()&&!DESK.canClose()){ panel.hidden=true; syncEvidence(); return; }
        panel.hidden=false;
        DESK.refresh().then(paint);
        if(refreshBtn) refreshBtn.addEventListener("click",function(){ DESK.refresh().then(paint); });
      }
      if(window.Auth&&typeof window.Auth.loadCapabilities==="function"){
        window.Auth.loadCapabilities().then(start).catch(start);
      } else start();
    })();
  }
  syncEvidence();

  function newIdempotencyKey(){
    try{
      if(window.crypto&&typeof window.crypto.randomUUID==="function") return "desk-"+window.crypto.randomUUID();
    }catch(_){}
    return "desk-"+Date.now()+"-"+Math.random().toString(36).slice(2,10);
  }

  // Record an offline payment — POST /api/admin/payments/record/ (verified).
  // Success toast only AFTER the backend confirms.
  var form=document.getElementById("record-payment-form");
  if(form) form.addEventListener("submit", async function(e){
    e.preventDefault();
    var errBox=document.querySelector("[data-record-error]");
    if(errBox){ errBox.style.display="none"; }
    if(!form.checkValidity()){ form.reportValidity(); return; }
    var btn=form.querySelector("[type=submit]");
    if(!JONE.guardSubmit(btn)) return;
    var provider=providerEl?providerEl.value:"CASH";
    var drawer=cashEl?cashEl.value.trim():"";
    var slip=externalEl?externalEl.value.trim():"";
    function fail(msg){
      if(errBox){ errBox.textContent=msg; errBox.style.display="block"; }
      JONE.ui.toast(msg,"error");
      JONE.releaseGuard(btn);
    }
    if(provider==="CASH"&&!drawer){ return fail("Cash must go into your own open drawer. Open one in \u201CYour cash drawer\u201D above."); }
    if(provider!=="CASH"&&!slip){ return fail("Enter the terminal or bank reference printed on the slip."); }
    try{
      var result=await window.API.recordPayment({
        booking_reference: document.getElementById("rp-booking").value.trim(),
        amount: String(document.getElementById("rp-amount").value),
        provider: provider,
        notes: document.getElementById("rp-notes").value.trim(),
        cash_session_reference: provider==="CASH"?drawer:"",
        external_reference: provider==="CASH"?"":slip,
        include_unbilled: true,
        idempotency_key: newIdempotencyKey()
      });
      var data=(result&&result.data)||{};
      var folio=data.folio||{};
      // A replay means the money was already in the ledger: say so plainly
      // instead of telling the cashier a second payment was taken.
      JONE.ui.toast(data.replayed?"This payment was already recorded \u2014 nothing was added twice.":"Payment recorded.","success");
      if(folio&&Object.keys(folio).length){
        var remaining=Number(folio.outstanding_balance||0);
        JONE.ui.toast(remaining>0
          ? "Still owed on this folio: "+JONE.formatNaira(remaining)+"."
          : "This guest's folio is now fully settled.",
          remaining>0?"info":"success");
      }
      form.reset();
      if(DESK) DESK.refresh().then(syncEvidence);
      load();
    }catch(err){
      var msg=(err&&err.message)||"The payment couldn't be recorded.";
      if(errBox){ errBox.textContent=msg; errBox.style.display="block"; }
      JONE.ui.toast(msg,"error");
    }finally{
      JONE.releaseGuard(btn);
    }
  });

  paymentCapabilitiesReady.then(function(){
    var capturePanel=document.querySelector("[data-record-payment-panel]");
    if(capturePanel) capturePanel.hidden=!(window.Auth && window.Auth.hasCapability && window.Auth.hasCapability("booking.manage") && window.Auth.hasCapability("payment.capture"));
    load(1);
    loadRefunds(1);
  });
})();

</script>
