<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Audit Logs | J-ONE Staff</title>
<meta name="theme-color" content="#373435">
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J-ONE Hotel">
<link rel="stylesheet" href="../css/main.css?v=1.1.11">

</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Audit Logs</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Audit log</h2><div class="panel-actions"><label class="sr-only" for="al-filter">Filter by action</label><select class="select" id="al-filter" style="min-width:180px;font-size:var(--fs-sm);padding:0.5em 0.8em;"><option value="">All actions</option></select></div></div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Time</th><th>User</th><th>Action</th><th class="hide-sm">Detail</th><th class="hide-sm">IP</th><th><span class="sr-only">Open</span></th></tr></thead>
      <tbody data-tbody="audit"></tbody>
    </table></div>
    <div class="pagination" data-pagination></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/runtime-config.js?v=1.1.11"></script>
<script src="../js/config.js?v=1.1.11"></script>
<script src="../js/utils.js?v=1.1.11"></script>
<script src="../js/icons.js?v=1.1.11"></script>
<script src="../js/api.js?v=1.1.11"></script>
<script src="../js/theme.js?v=1.1.11"></script>
<script src="../js/ui.js?v=1.1.11"></script>
<script src="../js/auth.js?v=1.1.11"></script>
<script src="../js/hotel-data.js?v=1.1.11"></script>
<script src="../js/navigation.js?v=1.1.11"></script>
<script src="../js/dashboard.js?v=1.1.11"></script><script src="../js/table-fit.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("admin");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=audit]");

  /* Verified /api/admin/audit-logs/ row: { id, actor_email, actor_name,
     action, object_type, object_id, summary, changes, metadata,
     ip_address, created_at } — filters: action, object_type, actor,
     date_from, date_to (server-side). */
  function user(e){ return e.actor_name || e.actor_email || "System"; }

  function render(list){
    tbody.innerHTML=list.map(function(e){
      var href='audit-log-details.html?id='+encodeURIComponent(e.id);
      // Long summaries are clamped to a readable column width (cell-clamp) —
      // the COMPLETE text stays in the title attribute and on the details
      // page; the audit record itself is never modified or truncated.
      var summary=e.summary||'View details';
      return '<tr>'+
        '<td class="caption cell-nowrap">'+JONE.formatDateTime(e.created_at)+'</td>'+
        '<td>'+JONE.esc(user(e))+'</td>'+
        '<td class="cell-nowrap"><span class="badge">'+JONE.esc(String(e.action||"").replace(/_/g," "))+'</span></td>'+
        '<td class="hide-sm cell-clamp"><a href="'+href+'" title="'+JONE.esc(summary)+'">'+JONE.esc(summary)+'</a></td>'+
        '<td class="hide-sm caption cell-nowrap">'+JONE.esc(e.ip_address||"")+'</td>'+
        // Always-visible action so the detail can be opened on phones too.
        '<td class="cell-nowrap"><a class="btn btn-sm btn-outline" href="'+href+'" aria-label="View audit event '+JONE.esc(e.id)+'"><span data-icon="eye" data-size="14"></span><span class="hide-sm"> View</span></a></td>'+
      '</tr>';
    }).join("");
    JONE.icons.inject(tbody);
  }

  /* Server-driven paging: the action filter and page both travel in the
     request; a filter change restarts at page 1. */
  var state={ page:1 };
  var pager=document.querySelector("[data-pagination]");
  function renderPager(meta){ JONE.dashboard.renderPagination(pager, meta, { onPage: load }); }

  async function load(page){
    if(page!=null) state.page=Math.max(1,page);
    DATA.loading(tbody);
    try{
      var params={ page:state.page, page_size: JONE.dashboard.pageSize() };
      var al=document.getElementById("al-filter");
      if(al&&al.value) params.action=al.value;
      var res=await window.API.list("auditLogs",params);
      var list=window.API.normalizeList(res.data,res.pagination).items||[];
      if(!list.length){ DATA.empty(tbody,"fileText","No audit entries yet","Actions performed by staff will be recorded here.",6); renderPager(null); return; }
      render(list);
      renderPager(res.pagination);
    }catch(err){ DATA.error(tbody,"Audit log couldn't be loaded",(err&&err.message)||"Please try again in a moment.",6); }
  }
  /* The filter choices come from the backend (the actions it has actually
     recorded) so the dropdown can never drift out of step with the actions the
     server logs — new action types appear here with no frontend change. */
  async function loadActionFilter(){
    var al=document.getElementById("al-filter");
    if(!al) return;
    try{
      var res=await window.API.list("auditLogActions");
      var actions=(res&&res.data)||[];
      if(!Array.isArray(actions)||!actions.length) return;
      var current=al.value;
      al.innerHTML='<option value="">All actions</option>'+actions.map(function(a){
        return '<option value="'+JONE.esc(a.value)+'">'+JONE.esc(a.label||a.value)+"</option>";
      }).join("");
      if(current) al.value=current;
    }catch(err){ /* filter stays at "All actions"; the table itself still loads */ }
  }

  loadActionFilter();
  load(1);

  var al=document.getElementById("al-filter");
  if(al) al.addEventListener("change",function(){ load(1); });
})();

</script>
<script src="../js/pwa.js?v=1.1.11"></script>
<script src="../js/version.js?v=1.1.11"></script>
<script src="../js/update-checker.js?v=1.1.11"></script>
</body>
</html>
