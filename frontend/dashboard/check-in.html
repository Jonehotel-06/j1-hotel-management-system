<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Check-in | J-ONE Staff</title>
<meta name="theme-color" content="#373435">
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J-ONE Hotel">
<link rel="stylesheet" href="../css/main.css?v=1.1.6">

</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Check-in</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Today's arrivals</h2></div>
  <div class="panel-body no-pad">
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Reference</th><th>Guest</th><th class="hide-sm">Room</th><th>Arrival</th><th class="hide-sm">Balance</th><th></th></tr></thead>
      <tbody data-tbody="checkin"></tbody>
    </table></div>
  </div>
</section>
<section class="panel">
  <div class="panel-head"><h2>Currently in-house</h2></div>
  <div class="panel-body no-pad"><div class="table-wrap"><table class="table">
    <thead><tr><th>Reference</th><th>Guest</th><th>Room</th><th>Scheduled checkout</th><th>Status</th><th></th></tr></thead>
    <tbody data-tbody="inhouse"></tbody>
  </table></div></div>
</section>
<section class="panel">
  <div class="panel-head"><h2>Find a booking</h2></div>
  <div class="panel-body">
    <div class="form-grid fg-2">
      <div class="field"><label class="field-label" for="chi-q">Guest name, reference, phone, email, or room</label><input class="input" id="chi-q" title="Searches reference, guest name, phone, email, room number and room type" placeholder="e.g. J1-2048"></div>
      <div class="field" style="display:flex;align-items:end;"><button class="btn" data-chi-search style="width:100%;">Search</button></div>
    </div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/runtime-config.js?v=1.1.6"></script>
<script src="../js/config.js?v=1.1.6"></script>
<script src="../js/utils.js?v=1.1.6"></script>
<script src="../js/icons.js?v=1.1.6"></script>
<script src="../js/api.js?v=1.1.6"></script>
<script src="../js/theme.js?v=1.1.6"></script>
<script src="../js/ui.js?v=1.1.6"></script>
<script src="../js/auth.js?v=1.1.6"></script>
<script src="../js/hotel-data.js?v=1.1.6"></script>
<script src="../js/navigation.js?v=1.1.6"></script>
<script src="../js/dashboard.js?v=1.1.6"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA=JONE.dashboard.DATA;
  var tbody=document.querySelector("[data-tbody=checkin]");
  var inhouseBody=document.querySelector("[data-tbody=inhouse]");
  var arrivals=[];
  function renderInHouse(list){
    if(!list.length){ DATA.empty(inhouseBody,"bed","No guests currently in-house","Checked-in guests will remain visible here.",6); return; }
    inhouseBody.innerHTML=list.map(function(b){ var ref=refOf(b); return '<tr><td>'+JONE.esc(ref)+'</td><td>'+JONE.esc(b.guest_name||"—")+'</td><td>'+JONE.esc(roomLabel(b))+'</td><td>'+JONE.esc(b.check_out?JONE.formatDate(b.check_out,"mid"):"—")+'</td><td>'+JONE.dashboard.statusPill(b.status)+'</td><td><a class="btn btn-sm btn-outline" href="booking-details.html?ref='+encodeURIComponent(ref)+'">View</a></td></tr>'; }).join("");
    JONE.icons.inject(inhouseBody);
  }

  /* Verified /api/admin/bookings/ row shape. Today's expected arrivals:
     status=CONFIRMED & check_in=<today> (exact-date filter). */
  function refOf(b){ return b.booking_reference || b.id; }
  function roomLabel(b){ return (b.room_numbers && b.room_numbers.length) ? b.room_numbers.join(", ") : (b.room_type_name || "—"); }

  function render(list){
    tbody.innerHTML=list.map(function(b){
      var ref=refOf(b);
      var due=b.amount_due!=null?Number(b.amount_due):null;
      return '<tr><td>'+JONE.esc(ref)+'</td><td>'+JONE.esc(b.guest_name||"—")+'</td><td class="hide-sm">'+JONE.esc(roomLabel(b))+'</td><td>'+JONE.esc(b.check_in?JONE.formatDate(b.check_in,"mid"):b.status||"—")+'</td><td class="hide-sm num">'+(due!=null?(due>0?JONE.formatNaira(due):"<span class='text-success'>Settled</span>"):"—")+'</td><td><button class="btn btn-sm btn-accent" data-checkin-btn="'+encodeURIComponent(ref)+'">Check in</button></td></tr>';
    }).join("") || '<tr><td colspan="6"><div class="empty-state"><span data-icon="logOut"></span><h3>No arrivals today</h3></div></td></tr>';
    JONE.icons.inject(tbody);
  }

  function apply(){
    var q=(document.getElementById("chi-q")?document.getElementById("chi-q").value.trim():"");
    // Empty box = the already-loaded arrivals list. As soon as a term is typed
    // the page asks the SERVER (see the debounced handler below), which also
    // matches room numbers, emails and phone numbers.
    render(arrivals.filter(function(b){return !q || String(refOf(b)).toLowerCase().indexOf(q.toLowerCase())>-1 || String(b.guest_name||"").toLowerCase().indexOf(q.toLowerCase())>-1;}));
  }

  async function load(){
    DATA.loading(tbody);
    try{
      var results=await Promise.all([
        window.API.list("bookings",{ status:"CONFIRMED", check_in:JONE.hotelTodayISO(0), ordering:"check_in", page_size:50 }),
        window.API.list("bookings",{ status:"CHECKED_IN", ordering:"check_out", page_size:50 })
      ]);
      var list=window.API.normalizeList?window.API.normalizeList(results[0].data,results[0].pagination).items:((results[0].data&&results[0].data.results)||results[0].data||[]);
      var housed=window.API.normalizeList?window.API.normalizeList(results[1].data,results[1].pagination).items:((results[1].data&&results[1].data.results)||results[1].data||[]);
      arrivals=list||[]; renderInHouse(housed||[]);
      if(!arrivals.length){ DATA.empty(tbody,"logOut","No arrivals today","Guests expected to check in today will appear here.",6); return; }
      apply();
    }catch(err){ DATA.error(tbody,"Arrivals couldn't be loaded",(err&&err.message)||"Please try again in a moment.",6); }
  }
  load();

  var s=document.querySelector("[data-chi-search]");
  if(s) s.addEventListener("click",apply);
  var qEl=document.getElementById("chi-q");
  if(qEl) qEl.addEventListener("input", JONE.debounce(async function(){
    var q=qEl.value.trim(); if(!q){ apply(); return; }
    try { var res=await window.API.list("bookings",{status:"CONFIRMED,CHECKED_IN",search:q,ordering:"check_in",page_size:25}); var rows=window.API.normalizeList?window.API.normalizeList(res.data,res.pagination).items:((res.data&&res.data.results)||res.data||[]); render(rows.filter(function(b){return b.status!=="CHECKED_IN";})); renderInHouse(rows.filter(function(b){return b.status==="CHECKED_IN";})); }
    catch(err){ DATA.error(tbody,"Search failed",err.message||"Please try again.",6); }
  },300));

  // Check-in is a real backend action (POST /api/admin/bookings/{ref}/check-in/):
  // success is only shown AFTER the server confirms.
  document.addEventListener("click", async function(e){
    var btn=e.target.closest("[data-checkin-btn]");
    if(!btn) return;
    var ref=decodeURIComponent(btn.getAttribute("data-checkin-btn"));
    if(!JONE.guardSubmit(btn)) return;
    try{
      btn.disabled=true;
      await window.API.checkInBooking(ref);
      JONE.ui.toast("Guest checked in ("+ref+").","success");
      load();
    }catch(err){
      JONE.releaseGuard(btn);
      btn.disabled=false;
      JONE.ui.toast(err && (err.message || "Couldn't check in this guest. Please try again."),"error");
    }
  });
})();

</script>
<script src="../js/pwa.js?v=1.1.6"></script>
<script src="../js/version.js?v=1.1.6"></script>
<script src="../js/update-checker.js?v=1.1.6"></script>
</body>
</html>
