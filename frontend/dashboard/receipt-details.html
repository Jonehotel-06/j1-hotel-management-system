<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
/* Pre-paint theme (anti-flash): apply the stored/system theme BEFORE any content paints. */
(function(){try{var k="jone.theme";var s=window["local"+"Storage"];var raw=(s&&s.getItem(k))||null;var v=null;try{v=JSON.parse(raw);}catch(e){v=raw;}if(v!=="dark"&&v!=="light"){v=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",v);document.documentElement.style.colorScheme=v;}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Receipt | J-ONE Staff</title>
<meta name="theme-color" content="#373435">
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J-ONE Staff">
<link rel="stylesheet" href="../css/main.css?v=1.1.20">

</head>
<body class="receipt-view-page">
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <script>
    /* Sidebar pre-paint: the menu is painted from this ROLE's cached snapshot
       during HTML parsing, so it is on screen with the page instead of
       rebuilding after the dashboard scripts boot. The snapshot is used only
       when the role it was rendered for is the role in this browser's stored
       session; anything else (no cache, another account, signed out) leaves the
       menu empty — the dashboard script then renders it properly. */
    (function(){
      var nav=document.querySelector("[data-dash-nav]");
      if(!nav)return;
      var role=null;
      try{
        var raw=window["local"+"Storage"].getItem("jone.auth");
        if(raw){var p=JSON.parse(raw)||{};var u=p.user||p;role=(u&&u.role)||p.role||null;if(role)role=String(role).toLowerCase();}
      }catch(e){role=null;}
      if(!role)return;
      var snap=null;
      try{snap=JSON.parse(window.sessionStorage.getItem("jone.dash.nav")||"null");}catch(e){snap=null;}
      if(!snap||snap.role!==role||typeof snap.html!=="string"||!snap.html)return;
      nav.innerHTML=snap.html;
      var here=location.pathname.split("/").pop()||"index.html";
      var items=nav.querySelectorAll("a.dash-nav-item");
      for(var i=0;i<items.length;i++){
        items[i].classList.remove("is-active");
        items[i].removeAttribute("aria-current");
        var href=(items[i].getAttribute("href")||"").split("?")[0].split("#")[0];
        if(href===here){items[i].classList.add("is-active");items[i].setAttribute("aria-current","page");}
      }
      nav.setAttribute("data-nav-snapshot","1");
    })();
    </script>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Payment receipt</h1>
          <p data-rc-subtitle>Loading&hellip;</p>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </header>
    <main class="dash-content">

<section class="receipt-viewer" aria-labelledby="receipt-view-heading">
  <div class="receipt-view-top no-print">
    <a class="receipt-view-icon" href="receipts.html" aria-label="Back to receipts"><span data-icon="arrowLeft" data-size="30"></span></a>
    <time class="receipt-view-date" data-receipt-view-date datetime="">Receipt</time>
    <a class="receipt-view-icon" href="receipts.html" aria-label="Close receipt"><span data-icon="x" data-size="32"></span></a>
  </div>
  <h2 class="receipt-view-heading no-print" id="receipt-view-heading">Receipt</h2>

  <div class="receipt-details-shell">
    <article class="receipt-sheet rc-access" id="receipt" data-receipt>
      <div class="loading-block"><div class="spinner" role="status"></div><p class="muted">Loading receipt&hellip;</p></div>
    </article>

    <section class="receipt-export-panel no-print" aria-label="Receipt download and share options">
      <div class="receipt-export-row is-image">
        <div class="receipt-export-kind"><span data-icon="image" data-size="30"></span><strong>Image</strong></div>
        <button class="receipt-export-action" data-download-image type="button"><span data-icon="download" data-size="28"></span><span>Download</span></button>
        <button class="receipt-export-action is-share" data-share-image type="button"><span data-icon="share" data-size="28"></span><span>Share Receipt</span></button>
      </div>
      <div class="receipt-export-row is-pdf">
        <div class="receipt-export-kind"><span class="receipt-export-file-icon" aria-hidden="true">PDF</span><strong>PDF</strong></div>
        <button class="receipt-export-action" data-download-pdf type="button"><span data-icon="download" data-size="28"></span><span>Download</span></button>
        <button class="receipt-export-action is-share" data-share-pdf type="button"><span data-icon="share" data-size="28"></span><span>Share Receipt</span></button>
      </div>
    </section>

    <div class="receipt-utility-actions no-print" aria-label="Other receipt actions">
      <button class="btn btn-accent" data-print type="button"><span data-icon="printer" data-size="16"></span> Print receipt</button>
      <button class="btn btn-outline" data-email type="button" hidden><span data-icon="mail" data-size="16"></span> Email guest</button>
      <a class="btn btn-ghost" data-booking-link href="bookings.html" hidden><span data-icon="arrowLeft" data-size="16"></span> Booking</a>
    </div>
  </div>
</section>
    </main>
  </div>
</div>
<script src="../js/runtime-config.js?v=1.1.20"></script>
<script src="../js/config.js?v=1.1.20"></script>
<script src="../js/utils.js?v=1.1.20"></script>
<script src="../js/icons.js?v=1.1.20"></script>
<script src="../js/api.js?v=1.1.20"></script>
<script src="../js/theme.js?v=1.1.20"></script>
<script src="../js/ui.js?v=1.1.20"></script>
<script src="../js/auth.js?v=1.1.20"></script>
<script src="../js/hotel-data.js?v=1.1.20"></script>
<script src="../js/receipt.js?v=1.1.20"></script>
<script src="../js/navigation.js?v=1.1.20"></script>
<script src="../js/receipt-email-modal.js?v=1.1.20"></script>
<script src="../js/dashboard.js?v=1.1.20"></script><script src="../js/table-fit.js?v=1.1.20"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot(["admin","manager","general_manager",
    "front_desk_supervisor","receptionist","accounts_manager","accountant"]);
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });
  var receiptDetailCapabilitiesReady = window.Auth && typeof window.Auth.loadCapabilities === "function"
    ? window.Auth.loadCapabilities().catch(function(){ return []; })
    : Promise.resolve([]);

(function(){
  "use strict";
  var sheet = document.querySelector("[data-receipt]");
  var subtitle = document.querySelector("[data-rc-subtitle]");
  var viewDate = document.querySelector("[data-receipt-view-date]");
  var ref = new URLSearchParams(location.search).get("ref");
  var data = null;

  /* Verified receipt shape: GET /api/bookings/{ref}/receipt/ (owner or staff).
     The Access-style renderer in js/receipt.js uses the same authoritative
     server payload for screen, image export and PDF export — no totals are
     recalculated in the browser. */
  function esc(value){ return JONE.esc(value == null || value === "" ? "—" : String(value)); }

  function render(d){
    data = d || {};
    if (!window.JONE || !JONE.receipts) {
      showError({ message: "Receipt renderer is unavailable." });
      return;
    }
    JONE.receipts.render(sheet, data, {
      assetPrefix: "../",
      sourceLabel: "J-ONE Staff Console",
      documentTitle: "Transaction Receipt"
    });
    if (subtitle) {
      subtitle.textContent = (data.receipt_reference || data.booking_reference || "") +
        (data.guest && data.guest.name ? " · " + data.guest.name : "");
    }
    if (viewDate) {
      var dateInfo = longReceiptDate(data);
      viewDate.textContent = dateInfo.label;
      viewDate.setAttribute("datetime", dateInfo.iso);
    }
    var auth = window.Auth;
    /* Same rule as the receipts list: the booking link appears only when the
       access registry admits this department to the booking screen AND the
       server grants booking data. */
    var canOpenBooking = !!(auth && auth.hasCapability &&
      window.JONE && JONE.dashboard && JONE.dashboard.canOpenPage &&
      JONE.dashboard.canOpenPage("booking-details.html") &&
      (auth.hasCapability("booking.read") || auth.hasCapability("booking.manage")));
    var link = document.querySelector("[data-booking-link]");
    if (link) {
      if (data.booking_reference && canOpenBooking) {
        link.href = "booking-details.html?ref=" + encodeURIComponent(data.booking_reference);
        link.hidden = false;
      } else link.hidden = true;
    }
    var emailAction = document.querySelector("[data-email]");
    if (emailAction) emailAction.hidden = !(auth && auth.hasCapability && auth.hasCapability("payment.receipt.send"));
  }

  function longReceiptDate(d){
    var raw = d && (d.issued_at || d.created_at || d.updated_at || (d.latest_payment && (d.latest_payment.paid_at || d.latest_payment.created_at)));
    var parsed = raw ? new Date(raw) : new Date();
    if (Number.isNaN(parsed.getTime())) parsed = new Date();
    return {
      label: parsed.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }),
      iso: parsed.toISOString().slice(0, 10)
    };
  }

  function showError(err){
    sheet.innerHTML = '<div class="empty-state"><span data-icon="alertTriangle" data-size="34"></span>' +
      "<h1 class=\'h2\'>Receipt unavailable</h1><p>" + esc((err && err.message) || "We couldn't load this receipt.") +
      '</p><a class="btn btn-sm btn-outline" href="receipts.html" style="margin-top:0.75rem;">Back to receipts</a></div>';
    JONE.icons.inject(sheet);
    if (subtitle) subtitle.textContent = "Unavailable";
  }

  async function load(){
    if (!ref) { showError({ message: "No booking reference was provided." }); return; }
    try {
      await receiptDetailCapabilitiesReady;
      var res = await window.API.getStaffBookingReceipt(ref);
      render(res.data || {});
    } catch (err) { showError(err); }
  }
  load();

  /* ------------------------------- Actions -------------------------------- */
  var printBtn = document.querySelector("[data-print]");
  if (printBtn) printBtn.addEventListener("click", function(){
    if (!data || !window.JONE || !JONE.receipts) return;
    JONE.receipts.printReceipt(sheet, data);
  });

  async function exportReceipt(button, kind){
    if (!data || !window.JONE || !JONE.receipts) return;
    if (!JONE.guardSubmit(button)) return;
    var prev = button.innerHTML;
    button.innerHTML = '<span class="btn-spinner"></span> Preparing…';
    try {
      var exportOpts = { assetPrefix: "../", sourceLabel: "J-ONE Staff Console", documentTitle: "Transaction Receipt" };
      if (kind === "pdf") await JONE.receipts.downloadPDF(sheet, data, exportOpts);
      else await JONE.receipts.downloadImage(sheet, data, exportOpts);
      JONE.ui.toast(kind === "pdf" ? "Receipt PDF downloaded." : "Receipt image downloaded.", "success");
    } catch (err) {
      JONE.ui.toast((err && err.message) || "The receipt could not be exported.", "error");
    } finally {
      JONE.releaseGuard(button);
      button.innerHTML = prev;
      JONE.icons.inject(button);
    }
  }

  var imageBtn = document.querySelector("[data-download-image]");
  if (imageBtn) imageBtn.addEventListener("click", function(){ exportReceipt(imageBtn, "image"); });

  var pdfBtn = document.querySelector("[data-download-pdf]");
  if (pdfBtn) pdfBtn.addEventListener("click", function(){ exportReceipt(pdfBtn, "pdf"); });

  async function shareReceipt(button, kind){
    if (!data || !window.JONE || !JONE.receipts) return;
    if (!JONE.guardSubmit(button)) return;
    var prev = button.innerHTML;
    button.innerHTML = '<span class="btn-spinner"></span> Preparing…';
    try {
      var exportOpts = { assetPrefix: "../", sourceLabel: "J-ONE Staff Console", documentTitle: "Transaction Receipt" };
      var result = kind === "pdf"
        ? await JONE.receipts.sharePDF(sheet, data, exportOpts)
        : await JONE.receipts.shareImage(sheet, data, exportOpts);
      if (result && result.shared) JONE.ui.toast("Receipt ready to share.", "success");
      else JONE.ui.toast("Sharing is not available on this device, so the receipt was downloaded instead.", "info");
    } catch (err) {
      var cancelled = err && (err.name === "AbortError" || /cancel/i.test(err.message || ""));
      JONE.ui.toast(cancelled ? "Sharing cancelled." : ((err && err.message) || "The receipt could not be shared."), cancelled ? "info" : "error");
    } finally {
      JONE.releaseGuard(button);
      button.innerHTML = prev;
      JONE.icons.inject(button);
    }
  }

  var shareImageBtn = document.querySelector("[data-share-image]");
  if (shareImageBtn) shareImageBtn.addEventListener("click", function(){ shareReceipt(shareImageBtn, "image"); });
  var sharePdfBtn = document.querySelector("[data-share-pdf]");
  if (sharePdfBtn) sharePdfBtn.addEventListener("click", function(){ shareReceipt(sharePdfBtn, "pdf"); });

  /* "Email guest" — the shared, accessible send-receipt modal (one flow on
     every dashboard page: opens immediately, shows guest/booking details, has
     a visible sending state, blocks duplicate submission, reports sent vs
     failed truthfully and always ends in a retryable state). */
  var emailBtn = document.querySelector("[data-email]");
  if (emailBtn) emailBtn.addEventListener("click", function(){
    if (!data || !data.booking_reference) return;
    var guestEmail = (data.guest && data.guest.email) || "";
    if (!guestEmail) { JONE.ui.toast("This guest has no email address on file.", "error"); return; }
    JONE.receiptEmailModal.open({
      bookingReference: data.booking_reference,
      guestName: (data.guest && data.guest.full_name) || "Guest",
      guestEmail: guestEmail
    });
  });
})();
</script>
<script src="../js/pwa.js?v=1.1.20"></script>
<script src="../js/version.js?v=1.1.20"></script>
<script src="../js/update-checker.js?v=1.1.20"></script>
</body>
</html>
