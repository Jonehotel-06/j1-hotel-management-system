/* Pre-paint theme (anti-flash): apply the stored/system theme BEFORE any content paints. */
(function(){try{var k="jone.theme";var s=window["local"+"Storage"];var raw=(s&&s.getItem(k))||null;var v=null;try{v=JSON.parse(raw);}catch(e){v=raw;}if(v!=="dark"&&v!=="light"){v=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",v);document.documentElement.style.colorScheme=v;}catch(e){}})();
</script>

    <script>
    /* Sidebar pre-paint: the menu is painted from this ROLE's cached snapshot
       during HTML parsing, so it is on screen with the page instead of
       rebuilding after the dashboard scripts boot. The snapshot is used only
       when the role it was rendered for is the role in this browser's stored
       session; anything else (no cache, another account, signed out) leaves the
       menu empty — the dashboard script then renders it properly. */
    (function(){
      var nav=document.querySelector("[data-dash-nav]");
      if(!nav)return;
      var role=null;
      try{
        var raw=window["local"+"Storage"].getItem("jone.auth");
        if(raw){var p=JSON.parse(raw)||{};var u=p.user||p;role=(u&&u.role)||p.role||null;if(role)role=String(role).toLowerCase();}
      }catch(e){role=null;}
      if(!role)return;
      var snap=null;
      try{snap=JSON.parse(window.sessionStorage.getItem("jone.dash.nav")||"null");}catch(e){snap=null;}
      if(!snap||snap.role!==role||typeof snap.html!=="string"||!snap.html)return;
      nav.innerHTML=snap.html;
      var here=location.pathname.split("/").pop()||"index.html";
      var items=nav.querySelectorAll("a.dash-nav-item");
      for(var i=0;i<items.length;i++){
        items[i].classList.remove("is-active");
        items[i].removeAttribute("aria-current");
        var href=(items[i].getAttribute("href")||"").split("?")[0].split("#")[0];
        if(href===here){items[i].classList.add("is-active");items[i].setAttribute("aria-current","page");}
      }
      nav.setAttribute("data-nav-snapshot","1");
    })();
    </script>

<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var DATA = JONE.dashboard.DATA;
  var tbody = document.querySelector("[data-tbody=bookings]");

  /* Verified /api/admin/bookings/ row:
     { id, booking_reference, guest_name, guest_phone, guest_email,
       room_type_name, room_numbers[], check_in, check_out, nights,
       number_of_rooms, number_of_guests, total_amount, amount_paid,
       amount_due, currency, status, payment_status, source, created_at }
     Filters (server-side): status, payment_status, source, room_type,
     date_from, date_to, check_in, check_out, search, ordering. */
  function refOf(b){ return b.booking_reference || b.id || "—"; }
  function roomLabel(b){
    if (b.room_numbers && b.room_numbers.length) return b.room_numbers.join(", ");
    return b.room_type_name || "—";
  }

  // Row cache so a recorded payment can refresh ONE row in place instead of
  // re-downloading the whole bookings list.
  var rowIndex = {};

  function actionCell(b){
    /* One shared rule (JONE.dashboard.canRecordPayment): the action is only
       offered when the booking can still accept money AND a balance is
       outstanding — a confirmed/settled payment shows no button. */
    var payBtn = JONE.dashboard.canRecordPayment(b)
      ? '<button class="btn btn-sm btn-accent" data-pay="' + JONE.esc(b.id) + '">' +
        '<span data-icon="wallet" data-size="14"></span> Record payment</button>'
      : "";
    return '<div class="row-actions">' + payBtn +
      '<a class="btn btn-sm btn-outline" href="booking-details.html?ref='+encodeURIComponent(refOf(b))+'">View</a>' +
      '</div>';
  }

  function render(list){
    if(!tbody) return;
    renderRows(list || []);
  }

  /* Update a single row from the authoritative booking snapshot returned by
     the payments endpoint — no table reload, no extra requests. */
  function refreshRow(id, fresh){
    var row = tbody && tbody.querySelector('[data-booking-row="'+String(id)+'"]');
    if(!row || !fresh) return;
    var merged = Object.assign({}, rowIndex[String(id)] || {}, fresh);
    rowIndex[String(id)] = merged;
    var cells = row.children;
    if(cells[5]) cells[5].innerHTML = JONE.dashboard.statusPill(merged.status);
    if(cells[6]) cells[6].innerHTML = JONE.dashboard.statusPill(merged.payment_status);
    if(cells[7]) cells[7].innerHTML = JONE.esc(JONE.formatNaira(merged.total_amount)) +
      '<div class="caption">Due '+JONE.esc(JONE.formatNaira(merged.amount_due||0))+'</div>';
    if(cells[8]) cells[8].innerHTML = actionCell(merged);
    JONE.icons.inject(row);
  }

  /* One delegated handler covers every row (and every future re-render). */
  if (tbody) tbody.addEventListener("click", function(e){
    var btn = e.target.closest && e.target.closest("[data-pay]");
    if(!btn) return;
    var id = btn.getAttribute("data-pay");
    var booking = rowIndex[id];
    if(!booking) return;
    openPaymentFor(booking, id);
  });

  function openPaymentFor(booking, rowId){
    JONE.dashboard.paymentModal(booking, {
      onRecorded: function(fresh){
        refreshRow(rowId || booking.id, fresh);
        if (JONE.dashboard.notifBadge) JONE.dashboard.notifBadge.refresh();
      }
    });
  }

  /* Server-side pagination: state holds ONLY the page; every filter value is
     read from the inputs at request time so paging always preserves the
     active search/status/payment/date. Any filter change resets to page 1. */
  var state = { page: 1 };
  var pager = document.querySelector("[data-pagination]");
  function renderPager(meta){ JONE.dashboard.renderPagination(pager, meta, { onPage: load }); }

  function filters(){
    var f = { page: state.page, page_size: JONE.dashboard.pageSize(), ordering: "-created_at" };
    var q = document.getElementById("bk-q"); if (q && q.value.trim()) f.search = q.value.trim();
    var st = document.getElementById("bk-status"); if (st && st.value) f.status = st.value;
    var py = document.getElementById("bk-pay"); if (py && py.value) f.payment_status = py.value;
    var dt = document.getElementById("bk-date"); if (dt && dt.value) f.check_in = dt.value;
    return f;
  }

  var debouncedReload = JONE.debounce ? JONE.debounce(function(){ load(1); }, 300) : function(){ load(1); };
  ["bk-q","bk-status","bk-pay","bk-date"].forEach(function(id){
    var el=document.getElementById(id);
    if(el){ el.addEventListener(id==="bk-q" ? "input" : "change", debouncedReload); }
  });

  // Pre-fill the search from the URL (e.g. guest history handoff).
  (function(){
    var pre = new URLSearchParams(location.search).get("search");
    if (pre) { var q = document.getElementById("bk-q"); if (q && !q.value) q.value = pre; }
  })();

  /* ------------------- New booking (walk-in / phone) -------------------
     Verified POST /api/admin/bookings/ contract — AdminBookingCreateSerializer:
     { room_type (slug), check_in, check_out, rooms, adults, children,
       source: WALK_IN|PHONE, status: PENDING|CONFIRMED, offer_code?,
       special_requests?, internal_notes?, guest: { first_name, last_name,
       email, phone } } — the backend validates availability and computes
       every amount. The response is the authoritative booking. */
  var roomTypes = [];
  async function loadTypes(){
    try{
      var res = await window.API.list("roomTypes", { page_size: 100 });
      roomTypes = window.API.normalizeList(res.data, res.pagination).items.map(function(t){ return { value: t.slug, label: t.name + " \u2014 " + JONE.formatNaira(t.base_price) + " / night" }; });
    }catch(_){ roomTypes = []; }
  }

  /* ---- Availability data for the New-booking calendar --------------------
     Same authoritative source as the public booking calendar:
     GET /api/rooms/{slug}/unavailable-dates/ (nightly_inventory service).
     The response carries per-date `available_rooms`, so the calendar can be
     ROOM-COUNT aware: a night is unavailable when fewer rooms remain free
     than the staff member is trying to book. Cached briefly per room type;
     the cache is invalidated when a booking succeeds, when the room type
     changes (different key), and on backend ROOM_UNAVAILABLE conflicts.
     The backend re-validates every night atomically at creation — this
     calendar is a usability layer, never the authority. */
  var AVAIL_TTL_MS = 60000;
  var availCache = {};   // slug -> { at, dates: {iso:{available_rooms}}, through, total }

  function fetchAvailability(slug, force){
    var hit = availCache[slug];
    if (hit && !force && Date.now() - hit.at < AVAIL_TTL_MS) return Promise.resolve(hit);
    return window.API.getUnavailableDates(slug, { days: 366 }).then(function(res){
      var data = (res && res.data) || {};
      var entry = { at: Date.now(), dates: data.dates || {}, through: data.through || null, total: data.total_rooms };
      availCache[slug] = entry;
      return entry;
    });
  }

  var newBtn = document.querySelector("[data-new-booking]");
  if (newBtn) newBtn.addEventListener("click", async function(){
    var created = null;
    if (!roomTypes.length) await loadTypes();

    /* State shared between the calendar custom field and the form. */
    var cal = null;               // stayCalendar instance
    var calSel = { checkIn: null, checkOut: null };
    var calEntry = null;          // availability entry currently applied
    var calSlug = "";             // room type the calendar reflects
    var calRooms = 1;             // requested room count
    var calStatus = null;         // status line element
    var typeLabelOf = {};
    roomTypes.forEach(function(t){ typeLabelOf[t.value] = t.label.split(" \u2014 ")[0]; });

    /* ---- C1: instant booking quote --------------------------------------
       Backend-authoritative display: POST /api/bookings/quote/ computes the
       price (the same endpoint the public form quotes from) and this block
       only RENDERS its answer — dates, room type, nights, nightly rate,
       rooms and total, with no tax line. It refreshes when the stay-defining
       inputs change and drops stale replies. */
    var physicalSelect=null, physicalSeq=0;
    async function loadPhysicalRooms(){
      if(!physicalSelect)return;
      var seq=++physicalSeq,form=physicalSelect.closest("form"),slug=form.elements.room_type.value;
      var previous=physicalSelect.value;physicalSelect.disabled=true;
      physicalSelect.innerHTML='<option value="">Select dates first</option>';
      if(!calSel.checkIn||!calSel.checkOut)return;
      try{
        var response=await window.API.getRoomTypeRooms(slug,{check_in:calSel.checkIn,check_out:calSel.checkOut});
        if(seq!==physicalSeq)return;
        var rows=window.API.normalizeList(response.data,response.pagination).items||[];
        physicalSelect.innerHTML='<option value="">Choose exact physical room</option>'+rows.map(function(room){return '<option value="'+JONE.esc(room.id)+'"'+(room.available!==true?' disabled':'')+'>Room '+JONE.esc(room.room_number)+' · '+JONE.esc(typeLabelOf[slug]||slug)+' · '+(room.available===true?'Available':'Unavailable for these dates')+'</option>';}).join('');
        physicalSelect.disabled=false;
        if(rows.some(function(room){return String(room.id)===previous&&room.available===true;}))physicalSelect.value=previous;
      }catch(err){if(seq!==physicalSeq)return;physicalSelect.innerHTML='<option value="">Rooms could not be loaded — retry dates/type</option>';JONE.ui.toast((err&&err.message)||"Room availability could not be loaded.","error");}
    }
    var quoteBox = null, quoteTimer = null, quoteSeq = 0;
    function scheduleQuote(){
      if (quoteTimer) clearTimeout(quoteTimer);
      quoteTimer = setTimeout(function(){refreshQuote();loadPhysicalRooms();}, 350);
    }
    function refreshQuote(){
      if (!quoteBox) return;
      var form = quoteBox.closest("form");
      if (!form) return;
      var slug = form.elements["room_type"] ? form.elements["room_type"].value : "";
      var rooms = Math.max(1, Number((form.elements["rooms"] && form.elements["rooms"].value) || 1));
      var adults = Math.max(1, Number((form.elements["adults"] && form.elements["adults"].value) || 1));
      var children = Math.max(0, Number((form.elements["children"] && form.elements["children"].value) || 0));
      var offer = (form.elements["offer_code"] && form.elements["offer_code"].value || "").trim();
      if (!slug || !calSel.checkIn || !calSel.checkOut) {
        quoteBox.textContent = "Fill in the stay details above to see the price.";
        return;
      }
      var my = ++quoteSeq;
      window.API.quoteBooking({
        room_type: slug, check_in: calSel.checkIn, check_out: calSel.checkOut,
        rooms: rooms, adults: adults, children: children,
        offer_code: offer || undefined
      }).then(function(res){
        if (my !== quoteSeq) return;
        var data = (res && res.data) || res || {};
        if (data.rooms != null && Number(data.rooms) !== rooms) return;
        var lines = [];
        lines.push("<strong>" + JONE.esc(data.room_type && data.room_type.name ? data.room_type.name : (typeLabelOf[slug] || "Room")) + "</strong> \u00b7 " +
          escDate(data.check_in) + " \u2192 " + escDate(data.check_out) + " \u00b7 " +
          escNum(data.nights) + " night" + (Number(data.nights) === 1 ? "" : "s"));
        lines.push(escNum(data.rooms) + " room" + (Number(data.rooms) === 1 ? "" : "s") + " \u00b7 " +
          JONE.formatNaira(data.price_per_night) + " per night");
        if (data.discount && Number(data.discount) > 0) {
          lines.push("Subtotal " + JONE.formatNaira(data.subtotal) + " \u00b7 discount \u2212" + JONE.formatNaira(data.discount));
        }
        lines.push("<strong>Total " + JONE.formatNaira(data.total) + "</strong>");
        quoteBox.innerHTML = lines.join("<br>");
      }).catch(function(err){
        if (my !== quoteSeq) return;
        quoteBox.textContent = "Quote unavailable: " + ((err && err.message) || "please check the stay details.");
      });
    }
    function escDate(iso){ if (!iso) return "\u2014"; var p = String(iso).split("-"); return p.length === 3 ? (p[2] + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(p[1]) - 1] + " " + p[0]) : String(iso); }
    function escNum(v){ return JONE.esc(String(v == null ? "\u2014" : v)); }

    /* ---- C2: per-room guest rows (name + email per additional room) ------
       The backend contract is authoritative (RoomOccupant rows, validated
       server-side); this block collects and sanity-checks the desk's input. */
    var roomGuestsApi = { read: function(){ return []; }, form: null };

    function nightUnavailable(iso){
      if (!calEntry) return false;
      var d = calEntry.dates[iso];
      if (!d) return false;
      return Number(d.available_rooms || 0) < Math.max(1, calRooms);
    }
    function setCalStatus(msg){ if (calStatus) calStatus.textContent = msg || ""; }

    function applyEntry(entry){
      calEntry = entry;
      if (!cal) return;
      cal.setBusy(false);
      cal.setError(false);
      if (entry.through) cal.setBounds({ max: entry.through });
      var scope = calSlug && typeLabelOf[calSlug] ? " for " + typeLabelOf[calSlug] : "";
      cal.setUnavailable(nightUnavailable, scope);
      if (entry.total === 0) {
        setCalStatus((typeLabelOf[calSlug] || "This room type") + " has no bookable rooms.");
      } else if (calRooms > 1) {
        setCalStatus("Showing dates with at least " + calRooms + " rooms free" + scope + ".");
      } else {
        setCalStatus("Struck-through dates are sold out" + scope + ".");
      }
    }

    function refreshAvailability(force){
      if (!calSlug || !cal) return;
      cal.setBusy(true);
      setCalStatus("Checking live availability\u2026");
      fetchAvailability(calSlug, force).then(applyEntry).catch(function(){
        if (!cal) return;
        cal.setBusy(false);
        cal.setError(true);
        setCalStatus("Live availability couldn't be loaded.");
      });
    }

    var out = await JONE.dashboard.formModal({
      title: "New booking (walk-in / phone)",
      submitText: "Create booking",
      wide: true,
      fields: [
        { name: "room_type", label: "Room type", type: "select", required: true, options: roomTypes.length ? roomTypes : [{ value: "", label: "No room types configured" }] },
        { name: "rooms", label: "Rooms", type: "number", required: true, value: 1 },
        {
          name: "stay_dates", label: "Stay dates", type: "custom", required: true,
          help: "Pick check-in, then check-out. Sold-out nights are disabled for the selected room type and room count; the server re-verifies every night before the booking is created.",
          render: function(mount, form){
            calStatus = document.createElement("p");
            calStatus.className = "caption";
            calStatus.setAttribute("aria-live", "polite");
            calStatus.style.cssText = "margin:0 0 0.4rem;";
            mount.appendChild(calStatus);
            cal = JONE.stayCalendar.mount(mount, {
              minDate: JONE.hotelTodayISO(0),
              maxDate: JONE.hotelTodayISO(365),
              months: (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) ? 1 : 2,
              onChange: function(sel, reason){
                calSel = sel;
                if (reason === "checkin-unavailable") {
                  setCalStatus("The selected room type is sold out on that check-in date.");
                } else if (reason === "range-unavailable") {
                  setCalStatus("That stay crosses a sold-out night \u2014 the check-out was cleared.");
                }
                scheduleQuote();
              },
              onRetry: function(){ refreshAvailability(true); }
            });

            var typeSel = form.elements["room_type"];
            var roomsInput = form.elements["rooms"];
            function syncType(){
              var slug = typeSel ? typeSel.value : "";
              if (slug === calSlug) return;
              calSlug = slug;
              calEntry = null;
              if (slug) refreshAvailability(false);
              else { cal.setUnavailable(null); setCalStatus(""); }
            }
            if (typeSel) typeSel.addEventListener("change", syncType);
            if (roomsInput) {
              roomsInput.min = "1";
              roomsInput.addEventListener("input", function(){
                var n = Math.max(1, Number(roomsInput.value || 1));
                if (n === calRooms) return;
                calRooms = n;
                if (calEntry) applyEntry(calEntry);   // re-derive disabled nights
              });
            }
            syncType();
          },
          validate: function(){
            if (!calSel.checkIn) return "Please select a check-in date on the calendar.";
            if (!calSel.checkOut) return "Please select a check-out date on the calendar.";
            return "";
          },
          getValue: function(){
            return { check_in: calSel.checkIn || "", check_out: calSel.checkOut || "" };
          }
        },
        { name: "physical_room", label: "Exact physical room", type: "custom", required: true,
          help: "Select the first room explicitly. Additional rooms on a multi-room booking retain the existing allocation workflow. Availability is checked again at submission; no walk-in substitution is allowed.",
          render: function(mount){physicalSelect=document.createElement("select");physicalSelect.className="select";physicalSelect.setAttribute("aria-label","Exact physical room");mount.appendChild(physicalSelect);loadPhysicalRooms();},
          getValue: function(){return physicalSelect?physicalSelect.value:"";},
          validate: function(){return physicalSelect&&!physicalSelect.disabled&&physicalSelect.value?"":"Choose an available physical room.";}
        },
        { name: "adults", label: "Adults", type: "number", required: true, value: 1 },
        { name: "children", label: "Children", type: "number", value: 0 },
        { name: "source", label: "Source", type: "select", options: [{ value: "WALK_IN", label: "Walk-in" }, { value: "PHONE", label: "Phone" }], value: "WALK_IN" },
        { name: "status", label: "Status", type: "select", options: [{ value: "CONFIRMED", label: "Confirmed" }, { value: "PENDING", label: "Pending payment" }], value: "CONFIRMED" },
        { name: "offer_code", label: "Discount / offer code (optional)", value: "", help: "Apply an approved offer to this guest. The server calculates the discount and final total." },
        {
          name: "booking_quote", label: "Instant quote", type: "custom",
          help: "Calculated by the server from the values above and shown before the booking is created. Display only \u2014 the booking records the authoritative amounts.",
          render: function(mount, form){
            quoteBox = document.createElement("div");
            quoteBox.className = "caption";
            quoteBox.setAttribute("aria-live", "polite");
            quoteBox.style.cssText = "border:1px solid #d8d8d8;border-radius:.5rem;padding:.75rem .9rem;margin:0;";
            quoteBox.textContent = "Fill in the stay details above to see the price.";
            mount.appendChild(quoteBox);
            ["room_type", "rooms", "adults", "children", "offer_code"].forEach(function(name){
              var el = form.elements[name];
              if (el) {
                el.addEventListener("input", scheduleQuote);
                el.addEventListener("change", scheduleQuote);
              }
            });
            scheduleQuote();
          },
          getValue: function(){ return null; }
        },
        { name: "special_requests", label: "Special requests", type: "textarea", rows: 2, value: "" },
        { name: "internal_notes", label: "Internal notes", type: "textarea", rows: 2, value: "" },
        { name: "guest_first_name", label: "Guest first name", required: true },
        { name: "guest_last_name", label: "Guest last name", required: true },
        { name: "guest_email", label: "Guest email", type: "email", required: true },
        { name: "guest_phone", label: "Guest phone", required: true },
        {
          name: "room_guests", label: "Guests in the other rooms", type: "custom",
          help: "When booking more than one room, record who is staying in each additional room. Each guest is invited to the portal at their own email address; the booking contact above stays the guest of the first room and is never overwritten here.",
          render: function(mount, form){
            roomGuestsApi.form = form;
            var box = document.createElement("div");
            mount.appendChild(box);
            function readRows(){
              return Array.prototype.slice.call(box.querySelectorAll("[data-room-guest-row]")).map(function(row){
                return {
                  name: (row.querySelector("[data-rg-name]") || {}).value || "",
                  email: ((row.querySelector("[data-rg-email]") || {}).value || "").trim()
                };
              });
            }
            roomGuestsApi.read = readRows;
            function buildRows(){
              var prev = readRows();
              var rooms = Math.max(1, Number((form.elements["rooms"] && form.elements["rooms"].value) || 1));
              var html = "";
              for (var i = 1; i < rooms; i++) {
                var p = prev[i - 1] || {};
                html += '<div data-room-guest-row="' + i + '" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;margin:.35rem 0;">' +
                  '<strong style="min-width:4.5rem;padding-bottom:.45rem;">Room ' + (i + 1) + '</strong>' +
                  '<label style="flex:1 1 10rem;">Guest name<input class="input" data-rg-name value="' + JONE.esc(p.name || "") + '" placeholder="Full name"></label>' +
                  '<label style="flex:1 1 13rem;">Email<input class="input" type="email" data-rg-email value="' + JONE.esc(p.email || "") + '" placeholder="guest@example.com"></label>' +
                  '</div>';
              }
              box.innerHTML = rooms > 1
                ? html
                : '<p class="caption" style="margin:0;">Booking one room \u2014 the booking contact is its guest. Add rooms to record who is staying in each one.</p>';
            }
            buildRows();
            var roomsInput = form.elements["rooms"];
            if (roomsInput) roomsInput.addEventListener("input", buildRows);
          },
          getValue: function(){ return roomGuestsApi.read(); },
          validate: function(){
            var rows = roomGuestsApi.read();
            var form = roomGuestsApi.form;
            var primary = String(((form && form.elements["guest_email"]) || {}).value || "").trim().toLowerCase();
            var seen = {};
            for (var i = 0; i < rows.length; i++) {
              var name = String(rows[i].name || "").trim();
              var email = String(rows[i].email || "").trim().toLowerCase();
              if (!name && !email) continue;
              var where = "Room " + (i + 2) + " guest";
              if (!name) return where + ": please enter the guest's name.";
              if (!email) return where + ": please enter the guest's email address.";
              if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return where + ": " + email + " is not a valid email address.";
              if (primary && email === primary) return where + ": " + email + " is the booking contact \u2014 the contact stays the guest of the first room and cannot also be a room guest.";
              if (seen[email]) return where + ": " + email + " is already listed in " + seen[email] + ". Each guest can only be in one room of this booking.";
              seen[email] = "Room " + (i + 2);
            }
            return "";
          }
        }
      ],
      onSubmit: async function(v){
        var payload = {
          room_type: v.room_type,
          room_id: Number(v.physical_room),
          check_in: v.check_in,
          check_out: v.check_out,
          rooms: Number(v.rooms || 1),
          adults: Number(v.adults || 1),
          children: Number(v.children || 0),
          source: v.source,
          status: v.status,
          special_requests: v.special_requests || "",
          internal_notes: v.internal_notes || "",
          guest: {
            first_name: String(v.guest_first_name || "").trim(),
            last_name: String(v.guest_last_name || "").trim(),
            email: String(v.guest_email || "").trim(),
            phone: String(v.guest_phone || "").trim()
          }
        };
        if (v.offer_code && String(v.offer_code).trim()) payload.offer_code = String(v.offer_code).trim();
        /* C2: per-room guests for multi-room bookings — name + email per
           additional room, sent at creation so every occupant is recorded
           (and later invited to the portal) before the desk moves on.
           room_index is 0-based with the booking contact in the first room. */
        var roomGuests = (v.room_guests || []).map(function(g, i){
          return {
            full_name: String(g.name || "").trim(),
            email: String(g.email || "").trim(),
            room_index: i + 1
          };
        }).filter(function(g){ return g.full_name || g.email; });
        if (roomGuests.length) payload.room_guests = roomGuests;
        try {
          var res = await window.API.create("bookings", payload);
          created = (res && res.data) || null;
          delete availCache[v.room_type];   // inventory changed — never serve stale data
          return res;
        } catch (err) {
          // Race lost: another booking took the room between the calendar
          // load and this submit. Refresh authoritative availability so the
          // now-blocked nights become visibly disabled, then surface the
          // backend's ROOM_UNAVAILABLE message via the modal error box.
          if (err && err.code === "ROOM_UNAVAILABLE") refreshAvailability(true);
          throw err;
        }
      }
    });
    cal = null; calStatus = null;  // modal closed — drop references

    /* The create response IS the authoritative booking detail (guest, room
       assignments, totals, balance) — so the new row is added immediately and
       the payment dialog opens right away. NO page reload and NO bookings-list
       reload happens before the payment step. */
    if (!created) return;
    var ref = created.booking_reference;
    JONE.ui.toast("Booking " + (ref || "") + " created.", "success");
    prependRow(created);

    if (JONE.dashboard.canRecordPayment(created)) {
      if (created.room_substitution) {
        JONE.ui.toast("Room " + created.room_substitution.requested_room_number +
          " was taken — Room " + created.room_substitution.assigned_room_number +
          " was reserved instead.", "warning");
      }
      await JONE.dashboard.paymentModal(created, {
        onRecorded: function(fresh){ refreshRow(created.id, fresh); }
      });
    }
    // One authoritative refresh AFTER the payment step (the row may have
    // changed status server-side, e.g. PENDING → CONFIRMED on full payment).
    // Page 1 so the just-created (newest-first) booking is always visible.
    load(1);
  });

  /* Insert a freshly created booking as the first row WITHOUT reloading the
     table: the create response already carries every field the row renders. */
  function prependRow(b){
    if(!tbody || !b) return;
    var existing = tbody.querySelector('[data-booking-row="'+String(b.id)+'"]');
    if(existing) return;
    rowIndex[String(b.id)] = normalizeDetail(b);
    var empty = tbody.querySelector('[data-tbody-empty], .empty-state');
    if(empty) tbody.innerHTML = "";
    tbody.insertAdjacentHTML("afterbegin", rowHTML(rowIndex[String(b.id)]));
    JONE.icons.inject(tbody.firstElementChild);
  }

  /* The create/detail response nests the guest and the room assignments; the
     table row wants the flat list shape. Mapping happens here, never in a
     second API call. */
  function normalizeDetail(b){
    var g = b.guest || {};
    return {
      id: b.id,
      booking_reference: b.booking_reference,
      guest_name: g.full_name || [g.first_name, g.last_name].filter(Boolean).join(" ") || b.guest_name || "—",
      guest_phone: g.phone || b.guest_phone || "",
      guest_email: g.email || b.guest_email || "",
      room_type_name: b.room_type_name,
      room_numbers: (b.room_assignments || []).map(function(a){ return a.room_number; }).filter(Boolean),
      check_in: b.check_in, check_out: b.check_out,
      status: b.status, payment_status: b.payment_status,
      total_amount: b.total_amount, amount_paid: b.amount_paid, amount_due: b.amount_due,
      currency: b.currency,
    };
  }

  function rowHTML(b){
    var ref = refOf(b);
    return '<tr data-booking-row="'+JONE.esc(b.id)+'">'+
      '<td class="cell-nowrap"><a class="nav-link" href="booking-details.html?ref='+encodeURIComponent(ref)+'">'+JONE.esc(ref)+'</a>'+
        '<div class="caption hide-md">'+JONE.esc(b.guest_name||"—")+'</div></td>'+
      '<td class="hide-sm cell-guest"><span class="cell-guest-name">'+JONE.esc(b.guest_name||"—")+'</span><div class="caption cell-guest-contact">'+JONE.esc(b.guest_phone||b.guest_email||"")+'</div></td>'+
      '<td class="hide-sm">'+JONE.esc(roomLabel(b))+'</td>'+
      '<td class="cell-nowrap">'+JONE.esc(b.check_in?JONE.formatDate(b.check_in,"mid"):"—")+'</td>'+
      '<td class="hide-sm cell-nowrap">'+JONE.esc(b.check_out?JONE.formatDate(b.check_out,"mid"):"—")+'</td>'+
      '<td class="cell-nowrap">'+JONE.dashboard.statusPill(b.status)+'</td>'+
      '<td class="hide-sm cell-nowrap">'+JONE.dashboard.statusPill(b.payment_status)+'</td>'+
      '<td class="hide-sm num cell-nowrap">'+JONE.esc(JONE.formatNaira(b.total_amount))+
        '<div class="caption">Due '+JONE.esc(JONE.formatNaira(b.amount_due||0))+'</div></td>'+
      '<td class="cell-nowrap">'+actionCell(b)+'</td>'+
    '</tr>';
  }

  function renderRows(list){
    rowIndex = {};
    list.forEach(function(b){ rowIndex[String(b.id)] = b; });
    tbody.innerHTML = list.map(rowHTML).join("");
    JONE.icons.inject(tbody);
  }

  async function load(page){
    if (page != null) state.page = Math.max(1, page);
    DATA.loading(tbody);
    try {
      var res = await window.API.list("bookings", filters());
      var list = window.API.normalizeList(res.data, res.pagination).items;
      if(!(list||[]).length){
        DATA.empty(tbody, "search", "No bookings found", "Adjust your search or filters.", 9);
        rowIndex = {};
        renderPager(null);
        return;
      }
      renderRows(list);
      renderPager(res.pagination);
    } catch(err){
      DATA.error(tbody, "Bookings couldn't be loaded", (err && err.message) || "Please try again in a moment.", 9);
    }
  }
  load(1);
})();

</script>
