<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Offers | J-ONE Staff</title>
<meta name="theme-color" content="#373435">
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J-ONE Hotel">
<link rel="stylesheet" href="../css/main.css?v=1.1.11">

</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Offers</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Offers</h2><div class="panel-actions"><button class="btn btn-sm" data-of-add>Create offer</button></div></div>
  <div class="panel-body">
    <div class="room-grid" data-offer-grid></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/runtime-config.js?v=1.1.11"></script>
<script src="../js/config.js?v=1.1.11"></script>
<script src="../js/utils.js?v=1.1.11"></script>
<script src="../js/icons.js?v=1.1.11"></script>
<script src="../js/api.js?v=1.1.11"></script>
<script src="../js/theme.js?v=1.1.11"></script>
<script src="../js/ui.js?v=1.1.11"></script>
<script src="../js/auth.js?v=1.1.11"></script>
<script src="../js/hotel-data.js?v=1.1.11"></script>
<script src="../js/navigation.js?v=1.1.11"></script>
<script src="../js/dashboard.js?v=1.1.11"></script><script src="../js/table-fit.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var data=[];
  var grid=document.querySelector("[data-offer-grid]");

  function render(){
    grid.innerHTML=data.map(function(o){
      var id=o.id||o.slug||o.title;
      /* Verified /api/admin/offers/ row: { id, title, slug, description,
         short_description, code, discount_type: PERCENTAGE|FIXED_AMOUNT,
         discount_value "10.00", start_date, end_date, is_active, is_featured } */
      var disc = o.discount_type === "PERCENTAGE" ? (Number(o.discount_value||0)+"% off") : (o.discount_value ? JONE.formatNaira(o.discount_value)+" off" : "");
      if (!disc && o.code) disc = o.code;
      var desc = o.short_description || o.description || "";
      var period = JONE.offerPeriod(o, "mid");
      var note = JONE.offerStatusNote(o);
      return '<article class="card card-hover"><div class="card-pad"><div class="flex-between" style="margin-bottom:1rem;"><span class="offer-tag">'+JONE.esc(disc)+'</span>'+JONE.dashboard.statusPill(o.is_active===false?"inactive":"active")+'</div><h3 style="font-size:var(--fs-lg);">'+JONE.esc(o.title||"—")+'</h3><p class="caption">'+JONE.esc(desc)+'</p>'+/* Staff need the START date as well as the end date: without it they
              cannot tell a scheduled offer from a live one. */
           (period?'<p class="caption offer-period"><span data-icon="calendar" data-size="14"></span> '+JONE.esc(period)+'</p>':'')+
           (note?'<p class="caption offer-note">'+JONE.esc(note)+'</p>':'')+(o.is_featured?'<span class="badge">Featured</span>':'')+'<div style="display:flex;gap:0.5rem;margin-top:1rem;"><button class="btn btn-sm btn-outline" data-of-edit="'+encodeURIComponent(id)+'">Edit</button><button class="btn btn-sm btn-danger" data-of-del="'+encodeURIComponent(id)+'">Delete</button></div></div></article>';
    }).join("") || '<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No offers yet</h3></div>';
    JONE.icons.inject(grid);
  }

  async function load(){
    grid.innerHTML='<div class="loading-block" style="grid-column:1/-1;"><div class="spinner" role="status"></div><p class="muted">Loading offers&hellip;</p></div>';
    try{
      var res=await window.API.list("offers");
      var list=window.API.normalizeList?window.API.normalizeList(res.data).items:((res.data&&res.data.results)||res.data||[]);
      data=list||[];
      if(!data.length){ grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No offers yet</h3></div>'; return; }
      render();
    }catch(err){
      grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><span data-icon="alertTriangle" data-size="34"></span><h3>Offers couldn\'t be loaded</h3><p>'+((err&&err.status===0&&err.message)||"Please try again in a moment.")+'</p></div>';
      JONE.icons.inject(grid);
    }
  }
  load();
  window.OFFERS=data;

  document.addEventListener("click",function(e){
    var del=e.target.closest("[data-of-del]");
    if(del){
      var id=decodeURIComponent(del.getAttribute("data-of-del"));
      JONE.ui.confirm({title:"Delete this offer?",danger:true}).then(async function(ok){
        if(!ok) return;
        try{ await window.API.remove("offers", id); JONE.ui.toast("Offer deleted.","success"); load(); }
        catch(err){ JONE.ui.toast("Couldn't delete this offer. Please try again.","error"); }
      });
    }
    var edit=e.target.closest("[data-of-edit]");
    if(edit){
      var o2=data.filter(function(x){ return String(x.id)===String(decodeURIComponent(edit.getAttribute("data-of-edit"))); })[0];
      if(o2) openOfferModal(o2);
    }
  });
  var add=document.querySelector("[data-of-add]");
  if(add) add.addEventListener("click",function(){ openOfferModal(null); });

  /* Verified write contract — OfferAdminSerializer (multipart):
     title, short_description, description, code, discount_type
     (PERCENTAGE|FIXED_AMOUNT), discount_value, start_date, end_date,
     min_nights, max_nights, room_type_ids[], is_active, is_featured,
     image (file, optional), terms. */
  var roomTypes=[];
  async function loadRoomTypes(){
    try{
      var res=await window.API.list("roomTypes",{ page_size:100 });
      roomTypes=window.API.normalizeList(res.data, res.pagination).items.map(function(t){ return { value:String(t.id), label:t.name }; });
    }catch(_){ roomTypes=[]; }
  }

  function offerFields(o){
    return [
      { name:"title", label:"Title", required:true, value:o?o.title:"" },
      { name:"code", label:"Promo code", value:o?(o.code||""):"", help:"Guests enter this code when booking." },
      { name:"short_description", label:"Short description", value:o?(o.short_description||""):"" },
      { name:"description", label:"Full description", type:"textarea", rows:3, value:o?(o.description||""):"" },
      { name:"discount_type", label:"Discount type", type:"select", required:true, options:[{value:"PERCENTAGE",label:"Percentage"},{value:"FIXED_AMOUNT",label:"Fixed amount"}], value:o?o.discount_type:"PERCENTAGE" },
      { name:"discount_value", label:"Discount value", type:"number", step:"0.01", required:true, value:o?o.discount_value:"" },
      { name:"start_date", label:"Start date", type:"date", required:true, value:o?o.start_date:"" },
      { name:"end_date", label:"End date", type:"date", required:true, value:o?o.end_date:"" },
      { name:"min_nights", label:"Min nights", type:"number", value:o?o.min_nights:"" },
      { name:"max_nights", label:"Max nights", type:"number", value:o?o.max_nights:"" },
      { name:"room_type_ids", label:"Applies to room types", type:"checks", options:roomTypes, value:o?(o.room_type_ids||[]):[] },
      { name:"terms", label:"Terms", type:"textarea", rows:2, value:o?(o.terms||""):"" },
      { name:"image", label:(o&&o.image_url)?"Replace image (optional)":"Image", type:"file", accept:"image/*" },
      { name:"is_active", label:"Active", type:"checkbox", value:o?o.is_active:true },
      { name:"is_featured", label:"Featured", type:"checkbox", value:o?!!o.is_featured:false }
    ];
  }

  async function openOfferModal(o){
    if(!roomTypes.length) await loadRoomTypes();
    var out=await JONE.dashboard.formModal({
      title: o?"Edit "+o.title:"Create offer",
      submitText: o?"Save changes":"Create offer",
      wide: true,
      multipart: true,
      fields: offerFields(o),
      onSubmit: function(v, fd){
        ["min_nights","max_nights"].forEach(function(k){ if(v[k]==="") delete v[k]; });
        if(o) return window.API.update("offers", o.id, fd).then(function(){ JONE.ui.toast("Offer saved.","success"); });
        return window.API.create("offers", fd).then(function(){ JONE.ui.toast("Offer created.","success"); });
      }
    });
    if(out) load();
  }
})();

</script>
<script src="../js/pwa.js?v=1.1.11"></script>
<script src="../js/version.js?v=1.1.11"></script>
<script src="../js/update-checker.js?v=1.1.11"></script>
</body>
</html>
