<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gallery | J-ONE Staff</title>
<meta name="theme-color" content="#373435">
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J-ONE Hotel">
<link rel="stylesheet" href="../css/main.css?v=1.1.11">

</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <div class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Gallery</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </div>
    <div class="dash-content">

<section class="panel">
  <div class="panel-head"><h2>Gallery &amp; media</h2><div class="panel-actions"><button class="btn btn-sm" data-gal-upload>Upload media</button></div></div>
  <div class="panel-body">
    <div class="gallery-grid" data-gallery-grid></div>
  </div>
</section>
    </div>
  </div>
</div>
<script src="../js/runtime-config.js?v=1.1.11"></script>
<script src="../js/config.js?v=1.1.11"></script>
<script src="../js/utils.js?v=1.1.11"></script>
<script src="../js/icons.js?v=1.1.11"></script>
<script src="../js/api.js?v=1.1.11"></script>
<script src="../js/theme.js?v=1.1.11"></script>
<script src="../js/ui.js?v=1.1.11"></script>
<script src="../js/auth.js?v=1.1.11"></script>
<script src="../js/hotel-data.js?v=1.1.11"></script>
<script src="../js/navigation.js?v=1.1.11"></script>
<script src="../js/dashboard.js?v=1.1.11"></script><script src="../js/table-fit.js"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("receptionist");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  var items=[];
  var grid=document.querySelector("[data-gallery-grid]");

  function url(g){ return g.image_url || g.image || g.file_url || g.src || ""; }
  function caption(g){ return g.caption || g.title || "J-ONE Hotel & Lodge"; }
  function category(g){ return g.category || g.type || ""; }
  function status(g){ return g.status || (g.is_active===false?"inactive":"active"); }

  function render(){
    grid.innerHTML=items.map(function(g){
      var id=g.id||g.slug||g.title||url(g);
      var img=url(g)?'<img src="'+JONE.esc(url(g))+'" alt="'+JONE.esc(caption(g))+'">':'<div class="placeholder-placeholder"><span data-icon="image"></span></div>';
      return '<div class="media wide" style="position:relative;"><div class="media" style="position:absolute;inset:0;aspect-ratio:auto;">'+img+'</div><div class="media-actions" style="position:absolute;top:0.5rem;right:0.5rem;z-index:2;display:flex;gap:0.4rem;"><button class="btn-icon btn-sm btn-outline" style="background:var(--color-surface);" data-gal-edit="'+encodeURIComponent(id)+'" aria-label="Edit"><span data-icon="edit" data-size="16"></span></button><button class="btn-icon btn-sm btn-danger" data-gal-del="'+encodeURIComponent(id)+'" aria-label="Delete"><span data-icon="trash" data-size="16"></span></button></div>'+(status(g)==="inactive"?'<span class="badge" style="position:absolute;bottom:0.5rem;left:0.5rem;z-index:2;">Inactive</span>':'')+'</div>';
    }).join("") || '<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No gallery images yet</h3></div>';
    JONE.icons.inject(grid);
  }

  async function load(){
    grid.innerHTML='<div class="loading-block" style="grid-column:1/-1;"><div class="spinner" role="status"></div><p class="muted">Loading gallery&hellip;</p></div>';
    try{
      var res=await window.API.list("gallery");
      var list=window.API.normalizeList(res.data, res.pagination).items;
      items=list||[];
      if(!items.length){ grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><h3>No gallery images yet</h3></div>'; return; }
      render();
    }catch(err){
      grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;border:0;"><span data-icon="alertTriangle" data-size="34"></span><h3>Gallery couldn\'t be loaded</h3><p>'+((err&&err.status===0&&err.message)||"Please try again in a moment.")+'</p></div>';
      JONE.icons.inject(grid);
    }
  }
  load();

  document.addEventListener("click",function(e){
    var del=e.target.closest("[data-gal-del]");
    if(del){
      var id=decodeURIComponent(del.getAttribute("data-gal-del"));
      JONE.ui.confirm({title:"Delete this image?",message:"This will remove the media from the gallery.",confirmText:"Delete",danger:true}).then(async function(ok){
        if(!ok) return;
        try{ await window.API.remove("gallery", id); JONE.ui.toast("Image deleted.","success"); load(); }
        catch(err){ JONE.ui.toast(err.message||"Couldn't delete this image.","error"); }
      });
    }
    var edit=e.target.closest("[data-gal-edit]");
    if(edit){
      var g=items.filter(function(x){ return String(x.id)===String(decodeURIComponent(edit.getAttribute("data-gal-edit"))); })[0];
      if(g) openGalleryModal(g);
    }
  });
  var up=document.querySelector("[data-gal-upload]");
  if(up) up.addEventListener("click",function(){ openGalleryModal(null); });

  /* Verified write contract — GalleryItemAdminSerializer (multipart):
     title, description, category, alt_text, display_order, is_active,
     image (file; required for create, optional replace on edit — an edit
     without a new file never touches the stored image). */
  var CATS=["HOTEL","ROOMS","RESTAURANT","FACILITIES","EVENTS","EXTERIOR","OTHER"];
  function galFields(g){
    return [
      { name:"title", label:"Title", required:true, value:g?g.title:"" },
      { name:"category", label:"Category", type:"select", required:true, options:CATS.map(function(c){return {value:c,label:c.charAt(0)+c.slice(1).toLowerCase()};}), value:g?g.category:"HOTEL" },
      { name:"alt_text", label:"Alt text", value:g?(g.alt_text||""):"", help:"Describe the image for screen readers." },
      { name:"description", label:"Caption / description", type:"textarea", rows:2, value:g?(g.description||""):"" },
      { name:"image", label:(g&&g.image_url)?"Replace image (optional)":"Image file", type:"file", accept:"image/*", required:!g },
      { name:"display_order", label:"Display order", type:"number", value:g?(g.display_order||0):0 },
      { name:"is_active", label:"Active (visible in public gallery)", type:"checkbox", value:g?g.is_active:true }
    ];
  }

  async function openGalleryModal(g){
    var out=await JONE.dashboard.formModal({
      title: g?"Edit media":"Upload media",
      submitText: g?"Save changes":"Upload",
      multipart: true,
      fields: galFields(g),
      onSubmit: function(v, fd){
        if(v.display_order==="") delete v.display_order;
        if(g) return window.API.update("gallery", g.id, fd).then(function(){ JONE.ui.toast("Media updated.","success"); });
        return window.API.create("gallery", fd).then(function(){ JONE.ui.toast("Media uploaded.","success"); });
      }
    });
    if(out) load();
  }
})();

</script>
<script src="../js/pwa.js?v=1.1.11"></script>
<script src="../js/version.js?v=1.1.11"></script>
<script src="../js/update-checker.js?v=1.1.11"></script>
</body>
</html>
