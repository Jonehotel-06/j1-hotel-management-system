<body><div class="dash"><aside class="dash-sidebar" aria-label="Staff navigation"><div class="dash-sidebar-brand"><img src="../assets/icons/logo-official.svg" alt="" width="30" height="42"><span><span class="brand-word">J-ONE</span><br><span class="brand-sub">Staff Console</span></span></div><nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav><div class="dash-sidebar-footer"><div data-dash-user></div><button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,.2);"><span data-icon="logOut" data-size="16"></span> Sign out</button></div></aside><div class="dash-main"><div class="dash-topbar"><div class="dash-topbar-left"><button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button><div class="dash-title" data-dash-title><h1>Maintenance</h1><p>Work orders, explicit room outages, and verified completion.</p></div></div><div class="dash-topbar-right"><div class="dash-topbar-actions" data-topbar-actions></div><button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false"><span class="icon-moon" data-icon="moon" data-size="18"></span><span class="icon-sun" data-icon="sun" data-size="18"></span></button></div></div><main class="dash-content"><section class="panel"><div class="panel-head"><h2>Work-order queue</h2><div class="panel-actions"><span class="caption" data-mnt-live-status>Connecting…</span><button class="btn btn-sm btn-outline" type="button" data-mnt-refresh>Refresh</button><button class="btn btn-sm" type="button" data-mnt-new><span data-icon="plus" data-size="15"></span> New work order</button></div></div><div class="filter-bar"><div class="field"><label class="field-label" for="mnt-search">Search</label><input class="input" id="mnt-search" placeholder="Reference, room, summary"></div><div class="field"><label class="field-label" for="mnt-status">Status</label><select class="select" id="mnt JONE.ui.initChrome();var __maintenanceAllowed=JONE.dashboard.boot(["admin","manager","receptionist","maintenance","maintenance_technician"]);document.querySelector("[data-logout]")&&document.querySelector("[data-logout]").addEventListener("click",function(){window.Auth.logout();});

async function createOrder(){if(!dispatcher()){JONE.ui.toast("Your role can claim and progress work orders assigned to you.","info");return;}var result=await JONE.dashboard.formModal({title:"Create maintenance work order",submitText:"Create work order",wide:true,fields:[roomPicker(),{name:"service_request_reference",label:"Guest-request reference",type:"text",placeholder:"Optional linked maintenance request"},{name:"category",label:"Category",type:"select",required:true,options:[{value:"ELECTRICAL",label:"Electrical"},{value:"PLUMBING",label:"Plumbing"},{value:"HVAC",label:"HVAC"},{value:"FURNITURE",label:"Furniture / fixtures"},{value:"SAFETY",label:"Safety"},{value:"GENERAL",label:"General maintenance"}]},{name:"priority",label:"Priority",type:"select",required:true,options:[{value:"NORMAL",label:"Normal"},{value:"HIGH",label:"High"},{value:"URGENT",label:"Urgent"},{value:"LOW",label:"Low"}]},assigneePicker(),{name:"due_at",label:"Due by",type:"datetime-local",help:"Server priority SLA applies when blank."},{name:"summary",label:"Summary",type:"text",required:true},{name:"description",label:"Description",type:"textarea",rows:4}],values:{priority:"NORMAL",category:"GENERAL"},onSubmit:async function(values){values=OPS.omitEmpty(values);values.idempotency_key=OPS.newIdempotencyKey("maintenance");await window.API.create("maintenanceWorkOrders",values);return{message:"Maintenance work order created."};}});if(result){JONE.ui.toast("Work order created.","success");load(1);}}

async function changeStatus(reference,target){var result=await JONE.dashboard.formModal({title:"Update work-order status",submitText:"Save status",fields:[{name:"note",label:"Work note",type:"textarea",rows:3,placeholder:"Record triage, repair, or verification detail"}],onSubmit:async function(values){await window.API.resourceAction("maintenanceWorkOrders",reference,"status",{status:target,note:values.note||""});return{message:"Work-order status updated."};}});if(result){JONE.ui.toast("Work-order status updated.","success");load();}}
async function claim(reference){try{await window.API.resourceAction("maintenanceWorkOrders",reference,"claim",{});JONE.ui.toast("Work order claimed.","success");load();}catch(err){JONE.ui.toast((err&&err.message)||"The work order could not be claimed.","error");}}
