<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
/* Pre-paint theme (anti-flash): apply the stored/system theme BEFORE any content paints. */
(function(){try{var k="jone.theme";var s=window["local"+"Storage"];var raw=(s&&s.getItem(k))||null;var v=null;try{v=JSON.parse(raw);}catch(e){v=raw;}if(v!=="dark"&&v!=="light"){v=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",v);document.documentElement.style.colorScheme=v;}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Audit Log Detail | J-ONE Staff</title>
<meta name="theme-color" content="#373435">
<link rel="icon" href="../favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png">
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J-ONE Staff">
<link rel="stylesheet" href="../css/main.css?v=1.1.12">

</head>
<body>
<div class="dash">
  <aside class="dash-sidebar" aria-label="Staff navigation">
    <div class="dash-sidebar-brand">
      <img src="../assets/icons/logo-official.svg" alt="" width="30" height="42">
      <span>
        <span class="brand-word">J-ONE</span><br>
        <span class="brand-sub">Staff Console</span>
      </span>
    </div>
    <nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav>
    <div class="dash-sidebar-footer">
      <div data-dash-user></div>
      <button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,0.2);">
        <span data-icon="logOut" data-size="16"></span> Sign out
      </button>
    </div>
  </aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <div class="dash-topbar-left">
        <button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button>
        <div class="dash-title" data-dash-title>
          <h1>Audit log detail</h1>
        </div>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-topbar-actions" data-topbar-actions></div>
        <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <span class="icon-moon" data-icon="moon" data-size="18"></span>
          <span class="icon-sun" data-icon="sun" data-size="18"></span>
        </button>
      </div>
    </header>
    <main class="dash-content">

<section class="panel">
  <div class="panel-head">
    <h2 data-title>Audit event</h2>
    <div class="panel-actions"><a class="btn btn-sm btn-outline" href="audit-logs.html">Back to audit logs</a></div>
  </div>
  <div class="panel-body" data-detail>
    <div class="loading-block"><div class="spinner" role="status"></div><p class="muted">Loading audit event&hellip;</p></div>
  </div>
</section>
    </main>
  </div>
</div>
<script src="../js/runtime-config.js?v=1.1.12"></script>
<script src="../js/config.js?v=1.1.12"></script>
<script src="../js/utils.js?v=1.1.12"></script>
<script src="../js/icons.js?v=1.1.12"></script>
<script src="../js/api.js?v=1.1.12"></script>
<script src="../js/theme.js?v=1.1.12"></script>
<script src="../js/ui.js?v=1.1.12"></script>
<script src="../js/auth.js?v=1.1.12"></script>
<script src="../js/hotel-data.js?v=1.1.12"></script>
<script src="../js/navigation.js?v=1.1.12"></script>
<script src="../js/dashboard.js?v=1.1.12"></script><script src="../js/table-fit.js?v=1.1.12"></script><script src="../js/audit-detail.js?v=1.1.12"></script>
<script>
  JONE.ui.initChrome();
  JONE.dashboard.boot("admin");
  document.querySelector("[data-logout]") && document.querySelector("[data-logout]").addEventListener("click", function(){ window.Auth.logout(); });

(function(){
  "use strict";
  var el = document.querySelector("[data-detail]");

  /* The event body is rendered by the SHARED renderer (js/audit-detail.js) that
     the audit-log modal also uses, so the page and the dialog can never show a
     different view of the same immutable record. */
  function showError(title, msg){
    el.innerHTML = JONE.auditDetail.errorBlock(title, msg) +
      '<a class="btn btn-sm btn-outline" href="audit-logs.html" style="margin-top:0.75rem;">Back to audit logs</a>';
    JONE.icons.inject(el);
  }

  async function load(){
    var id = new URLSearchParams(location.search).get("id");
    if (!id){ showError("Audit event not found", "No audit event was specified."); return; }
    try {
      var res = await window.API.getOne("auditLogs", id);
      var a = res.data || {};
      var titleEl = document.querySelector("[data-title]");
      if (titleEl) titleEl.textContent = String(a.action || "Audit event").replace(/_/g, " ");
      el.innerHTML = JONE.auditDetail.render(a);
    } catch (err) {
      var copy = JONE.auditDetail.errorCopy(err);
      showError(copy[0], copy[1]);
    }
  }
  load();
})();
</script>
<script src="../js/pwa.js?v=1.1.12"></script>
<script src="../js/version.js?v=1.1.12"></script>
<script src="../js/update-checker.js?v=1.1.12"></script>
</body>
</html>
