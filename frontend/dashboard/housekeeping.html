<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Housekeeping | J-ONE Staff</title><meta name="theme-color" content="#373435"><link rel="icon" href="../favicon/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="J-ONE Hotel"><link rel="stylesheet" href="../css/main.css?v=1.1.6">
</head>
<body>
<div class="dash"><aside class="dash-sidebar" aria-label="Staff navigation"><div class="dash-sidebar-brand"><img src="../assets/icons/logo-official.svg" alt="" width="30" height="42"><span><span class="brand-word">J-ONE</span><br><span class="brand-sub">Staff Console</span></span></div><nav class="dash-sidebar-nav" data-dash-nav aria-label="Staff"></nav><div class="dash-sidebar-footer"><div data-dash-user></div><button class="btn btn-sm btn-outline" data-logout style="width:100%;justify-content:center;color:#D6D5D3;border-color:rgba(255,255,255,.2);"><span data-icon="logOut" data-size="16"></span> Sign out</button></div></aside>
<div class="dash-main"><div class="dash-topbar"><div class="dash-topbar-left"><button class="btn-icon btn-outline dash-menu-toggle" aria-label="Open menu" data-icon="menu" data-size="22"></button><div class="dash-title" data-dash-title><h1>Housekeeping</h1><p>Room-readiness tasks with controlled clean, inspection, and completion evidence.</p></div></div><div class="dash-topbar-right"><div class="dash-topbar-actions" data-topbar-actions></div><button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false"><span class="icon-moon" data-icon="moon" data-size="18"></span><span class="icon-sun" data-icon="sun" data-size="18"></span></button></div></div>
<main class="dash-content"><section class="panel"><div class="panel-head"><h2>Task queue</h2><div class="panel-actions"><button class="btn btn-sm" type="button" data-hk-new><span data-icon="plus" data-size="15"></span> New task</button></div></div><div class="filter-bar"><div class="field"><label class="field-label" for="hk-search">Search</label><input class="input" id="hk-search" placeholder="Reference, room, summary"></div><div class="field"><label class="field-label" for="hk-status">Status</label><select class="select" id="hk-status"><option value="">All statuses</option><option value="OPEN">Open</option><option value="ASSIGNED">Assigned</option><option value="ACCEPTED">Accepted</option><option value="IN_PROGRESS">In progress</option><option value="READY_FOR_INSPECTION">Ready for inspection</option><option value="BLOCKED">Blocked</option><option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option></select></div><div class="field"><label class="field-label" for="hk-type">Task type</label><select class="select" id="hk-type"><option value="">All types</option><option value="CHECKOUT_CLEAN">Checkout clean</option><option value="STAYOVER_SERVICE">Stayover service</option><option value="TURNDOWN">Turndown</option><option value="INSPECTION">Inspection</option><option value="GUEST_REQUEST">Guest request</option><option value="DEEP_CLEAN">Deep clean</option></select></div><div class="field"><label class="field-label" for="hk-priority">Priority</label><select class="select" id="hk-priority"><option value="">All priorities</option><option value="URGENT">Urgent</option><option value="HIGH">High</option><option value="NORMAL">Normal</option><option value="LOW">Low</option></select></div><div class="field"><button class="btn btn-sm btn-outline" id="hk-apply" type="button">Apply</button></div></div><div class="panel-body no-pad"><div class="table-wrap" tabindex="0" role="region" aria-label="Housekeeping tasks, scroll sideways to see every column"><table class="table"><thead><tr><th>Task</th><th>Room</th><th>Type</th><th class="hide-sm">Assignee</th><th class="hide-sm">Due</th><th>Status</th><th></th></tr></thead><tbody data-hk-rows></tbody></table></div><div class="pagination" data-hk-pagination></div></div></section></main></div></div>
<script src="../js/runtime-config.js?v=1.1.6"></script><script src="../js/config.js?v=1.1.6"></script><script src="../js/utils.js?v=1.1.6"></script><script src="../js/icons.js?v=1.1.6"></script><script src="../js/api.js?v=1.1.6"></script><script src="../js/theme.js?v=1.1.6"></script><script src="../js/ui.js?v=1.1.6"></script><script src="../js/auth.js?v=1.1.6"></script><script src="../js/navigation.js?v=1.1.6"></script><script src="../js/dashboard.js?v=1.1.6"></script><script src="../js/operations.js?v=1.1.6"></script>
<script>
JONE.ui.initChrome();var __housekeepingAllowed=JONE.dashboard.boot(["admin","manager","receptionist","housekeeping"]);document.querySelector("[data-logout]")&&document.querySelector("[data-logout]").addEventListener("click",function(){window.Auth.logout();});
(function(){
if(!__housekeepingAllowed)return;var DATA=JONE.dashboard.DATA,OPS=JONE.operations,rowsEl=document.querySelector("[data-hk-rows]"),pager=document.querySelector("[data-hk-pagination]"),state={page:1};
var transitions={OPEN:["ASSIGNED","CANCELLED"],ASSIGNED:["ACCEPTED","CANCELLED"],ACCEPTED:["IN_PROGRESS","BLOCKED","CANCELLED"],IN_PROGRESS:["READY_FOR_INSPECTION","BLOCKED"],BLOCKED:["IN_PROGRESS","CANCELLED"],READY_FOR_INSPECTION:["COMPLETED","IN_PROGRESS"]};
function dispatcher(){return window.Auth&&window.Auth.hasAnyRole&&window.Auth.hasAnyRole(["admin","manager","receptionist"]);}function human(value){return OPS.label(value);}function due(value){return value?JONE.formatDateTime(value):"—";}
function filters(){var out={page:state.page,page_size:JONE.dashboard.pageSize()};[["search","hk-search"],["status","hk-status"],["type","hk-type"],["priority","hk-priority"]].forEach(function(pair){var val=(document.getElementById(pair[1]).value||"").trim();if(val)out[pair[0]]=val;});return out;}
function actionButtons(task){var ref=JONE.esc(task.reference),buttons='<button class="btn btn-sm btn-outline" type="button" data-hk-view="'+ref+'">View</button>';if(!task.assigned_to_email&&!["COMPLETED","CANCELLED"].includes(task.status))buttons+='<button class="btn btn-sm" type="button" data-hk-claim="'+ref+'">Claim</button>';if(dispatcher()&&!["COMPLETED","CANCELLED"].includes(task.status))buttons+='<button class="btn btn-sm btn-outline" type="button" data-hk-assign="'+ref+'">Dispatch</button>';(transitions[task.status]||[]).forEach(function(target){if(target!=="COMPLETED"||dispatcher())buttons+='<button class="btn btn-sm btn-outline" type="button" data-hk-status="'+ref+'" data-hk-target="'+JONE.esc(target)+'">'+JONE.esc(human(target))+'</button>';});return '<div class="row-actions">'+buttons+'</div>';}
function render(items){if(!items.length){DATA.empty(rowsEl,"bed","No housekeeping tasks found","Adjust the filters or create a room-readiness task.",7);return;}rowsEl.innerHTML=items.map(function(task){return '<tr><td><strong>'+JONE.esc(task.reference)+'</strong><br><small>'+JONE.esc(task.summary)+'</small></td><td>Room '+JONE.esc(task.room_number||"—")+'</td><td>'+JONE.esc(human(task.type))+'<br><small>'+JONE.dashboard.statusPill(task.priority)+'</small></td><td class="hide-sm">'+JONE.esc(task.assigned_to_name||"Unassigned")+'</td><td class="hide-sm cell-nowrap">'+JONE.esc(due(task.due_at))+'</td><td>'+JONE.dashboard.statusPill(task.status)+'</td><td>'+actionButtons(task)+'</td></tr>';}).join("");JONE.icons.inject(rowsEl);}
async function load(page){if(page!=null)state.page=Math.max(1,page);DATA.loading(rowsEl);try{var response=await window.API.list("housekeepingTasks",filters()),items=OPS.listItems(response);render(items);JONE.dashboard.renderPagination(pager,items.length?response.pagination:null,{onPage:load});}catch(err){DATA.error(rowsEl,"Housekeeping tasks couldn't be loaded",(err&&err.message)||"Please try again in a moment.",7);}}
function roomPicker(){return OPS.searchPicker({name:"room_id",label:"Room",required:true,resource:"rooms",placeholder:"Search room number",display:function(row){return "Room "+(row.room_number||row.id)+(row.room_type_name?" · "+row.room_type_name:"");}});}function assigneePicker(){return OPS.searchPicker({name:"assigned_to_id",label:"Housekeeper",resource:"staffDirectory",params:{roles:"HOUSEKEEPING"},placeholder:"Search housekeeper",display:function(row){return (row.full_name||row.email)+" · "+human(row.role);}});}
async function createTask(){if(!dispatcher()){JONE.ui.toast("Your role can claim and progress tasks assigned to you.","info");return;}var result=await JONE.dashboard.formModal({title:"Create housekeeping task",submitText:"Create task",wide:true,fields:[roomPicker(),{name:"stay_reference",label:"Stay reference",type:"text",placeholder:"Optional room stay context"},{name:"service_request_reference",label:"Guest-request reference",type:"text",placeholder:"Optional linked request"},{name:"type",label:"Task type",type:"select",required:true,options:[{value:"CHECKOUT_CLEAN",label:"Checkout clean"},{value:"STAYOVER_SERVICE",label:"Stayover service"},{value:"TURNDOWN",label:"Turndown"},{value:"INSPECTION",label:"Inspection"},{value:"GUEST_REQUEST",label:"Guest request"},{value:"DEEP_CLEAN",label:"Deep clean"}]},{name:"priority",label:"Priority",type:"select",required:true,options:[{value:"NORMAL",label:"Normal"},{value:"HIGH",label:"High"},{value:"URGENT",label:"Urgent"},{value:"LOW",label:"Low"}]},assigneePicker(),{name:"due_at",label:"Due by",type:"datetime-local",help:"Server priority SLA applies when blank."},{name:"summary",label:"Summary",type:"text",required:true},{name:"detail",label:"Details",type:"textarea",rows:4}],values:{priority:"NORMAL"},onSubmit:async function(values){values=OPS.omitEmpty(values);values.idempotency_key=OPS.newIdempotencyKey("housekeeping");await window.API.create("housekeepingTasks",values);return{message:"Housekeeping task created."};}});if(result){JONE.ui.toast("Housekeeping task created.","success");load(1);}}
async function assignTask(reference){var result=await JONE.dashboard.formModal({title:"Dispatch "+reference,submitText:"Save dispatch",wide:true,fields:[assigneePicker(),{name:"due_at",label:"Due by",type:"datetime-local"},{name:"note",label:"Dispatch note",type:"textarea",rows:3}],onSubmit:async function(values){await window.API.resourceAction("housekeepingTasks",reference,"assign",OPS.omitEmpty(values));return{message:"Task dispatch recorded."};}});if(result){JONE.ui.toast("Task dispatch recorded.","success");load();}}
async function changeStatus(reference,target){var result=await JONE.dashboard.formModal({title:"Update task status",submitText:"Save status",fields:[{name:"note",label:"Work note",type:"textarea",rows:3,placeholder:"Optional inspection or blocker detail"}],onSubmit:async function(values){await window.API.resourceAction("housekeepingTasks",reference,"status",{status:target,note:values.note||""});return{message:"Task status updated."};}});if(result){JONE.ui.toast("Task status updated.","success");load();}}
async function claim(reference){try{await window.API.resourceAction("housekeepingTasks",reference,"claim",{});JONE.ui.toast("Task claimed.","success");load();}catch(err){JONE.ui.toast((err&&err.message)||"The task could not be claimed.","error");}}
async function view(reference){var body=JONE.el("div",{class:"loading-skeleton",textContent:"Loading task…"}),comment=JONE.el("button",{class:"btn btn-sm btn-outline",type:"button",textContent:"Add comment"});JONE.ui.modal.open({title:"Housekeeping task "+reference,body:body,size:"modal-lg",footer:JONE.el("div",{},comment)});comment.addEventListener("click",function(){JONE.ui.modal.close();commentTask(reference);});try{var response=await window.API.getOne("housekeepingTasks",reference),task=response.data||{},events=(task.events||[]).map(function(event){return '<li><strong>'+JONE.esc(human(event.type))+'</strong> · '+JONE.esc(event.created_at?JONE.formatDateTime(event.created_at):"—")+(event.actor_email?" · "+JONE.esc(event.actor_email):"")+(event.message?'<br><span class="caption">'+JONE.esc(event.message)+'</span>':"")+'</li>';}).join("")||"<li>No timeline events recorded.</li>";body.innerHTML='<dl class="profile-grid"><div><dt>Room</dt><dd>'+JONE.esc(task.room_number||"—")+'</dd></div><div><dt>Status</dt><dd>'+JONE.dashboard.statusPill(task.status)+'</dd></div><div><dt>Assignee</dt><dd>'+JONE.esc(task.assigned_to_name||"Unassigned")+'</dd></div><div><dt>Due</dt><dd>'+JONE.esc(due(task.due_at))+'</dd></div></dl><h4 style="margin:1rem 0 .45rem;">Details</h4><p>'+JONE.esc(task.detail||"No additional details.")+'</p><h4 style="margin:1rem 0 .45rem;">Timeline</h4><ul>'+events+'</ul>';JONE.icons.inject(body);}catch(err){body.innerHTML='<div class="empty-state"><h3>Task unavailable</h3><p>'+JONE.esc((err&&err.message)||"Please try again.")+'</p></div>';}}
async function commentTask(reference){var result=await JONE.dashboard.formModal({title:"Add task comment",submitText:"Add comment",fields:[{name:"message",label:"Comment",type:"textarea",rows:4,required:true}],onSubmit:async function(values){await window.API.resourceAction("housekeepingTasks",reference,"comments",values);return{message:"Comment recorded."};}});if(result){JONE.ui.toast("Comment recorded.","success");load();view(reference);}}
document.querySelector("[data-hk-new]").addEventListener("click",createTask);document.getElementById("hk-apply").addEventListener("click",function(){load(1);});document.getElementById("hk-search").addEventListener("input",JONE.debounce(function(){load(1);},300));["hk-status","hk-type","hk-priority"].forEach(function(id){document.getElementById(id).addEventListener("change",function(){load(1);});});rowsEl.addEventListener("click",function(event){var target=event.target.closest("button");if(!target)return;if(target.dataset.hkView)view(target.dataset.hkView);else if(target.dataset.hkClaim)claim(target.dataset.hkClaim);else if(target.dataset.hkAssign)assignTask(target.dataset.hkAssign);else if(target.dataset.hkStatus)changeStatus(target.dataset.hkStatus,target.dataset.hkTarget);});if(!dispatcher())document.querySelector("[data-hk-new]").hidden=true;load(1);
})();
</script>
<script src="../js/pwa.js?v=1.1.6"></script><script src="../js/version.js?v=1.1.6"></script><script src="../js/update-checker.js?v=1.1.6"></script>
</body></html>
