          type: string
          format: date
        check_out:
          type: string
          format: date
        rooms:
          type: integer
          maximum: 50
          minimum: 1
          default: 1
        adults:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
        children:
          type: integer
          maximum: 100
          minimum: 0
          default: 0
        source:
