          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Price per night in hotel currency (NGN).
        max_guests:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        bed_type:
          type: string
          maxLength: 80
        bed_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        room_size:
          type: string
