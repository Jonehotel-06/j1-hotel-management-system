                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/{id}/:
    get:
      operationId: notifications_retrieve
      description: |-
        Full notification for `notification-details.html`.

        A user can only ever read their OWN notification — the queryset is scoped
        to the recipient, so someone else's id is a 404, never a leak. Opening the
        detail marks it read (the response carries the fresh unread count so the
        sidebar badge can update without another request).
      summary: Read one notification (owns only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDetail'
          description: ''
  /api/notifications/{id}/read/:
    post:
      operationId: notifications_read_create
      summary: Mark one notification as read
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      summary: Mark all notifications as read
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/notifications/unread-count/:
    get:
      operationId: notifications_unread_count_retrieve
      summary: Unread notification count
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/offers/:
    get:
      operationId: offers_list
      summary: Currently running offers
      tags:
      - Offers
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferPublic'
          description: ''
  /api/payments/initialize/:
    post:
      operationId: payments_initialize_create
      summary: Initialize a Paystack payment for a booking
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializePaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitializePaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitializePaymentRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializePayment'
          description: ''
  /api/payments/verify/{reference}/:
    get:
      operationId: payments_verify_retrieve
      summary: Verify a transaction server-side (idempotent)
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - Payments
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializePayment'
          description: ''
  /api/payments/webhook/:
    post:
      operationId: payments_webhook_create
      description: |-
        Receives charge events. Signature validation happens BEFORE parsing.

        CSRF is exempt because the request is authenticated via the HMAC signature,
        not a browser session.
      summary: Paystack webhook (signature verified)
      tags:
      - Payments
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/rooms/:
    get:
      operationId: rooms_list
      summary: List active room types
      tags:
      - Rooms
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomTypeList'
          description: ''
  /api/rooms/{slug}/:
    get:
      operationId: rooms_retrieve
      summary: Room type detail (images, amenities, applicable offers)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Rooms
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeDetail'
          description: ''
  /api/rooms/{slug}/rooms/:
    get:
      operationId: rooms_rooms_list
      description: |-
        The physical rooms that make up one room type.

        Only rooms the hotel can actually sell are listed: the type must be active,
        the room must be active and it must not be under maintenance or out of
        service. Availability is answered by the authoritative availability engine,
        never by a client-side hint.
      summary: Physical rooms of a room type (for book-this-room)
      parameters:
      - in: query
        name: check_in
        schema:
          type: string
          format: date
        description: Optional. When both dates are given each room reports whether
          it is free.
      - in: query
        name: check_out
        schema:
          type: string
          format: date
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Rooms
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicRoomOption'
          description: ''
  /api/rooms/{slug}/unavailable-dates/:
    get:
      operationId: rooms_unavailable_dates_retrieve
      description: Every date in the window reports whether the room type has at least
        one sellable physical room free that NIGHT. A date some booking merely touches
        is NOT unavailable while another physical room of the same type is still free;
        a date is unavailable only when every sellable room is blocked. A checkout
        day never blocks the next guest's check-in (half-open [check_in, check_out)
        nights).
      summary: Per-date availability calendar for one room type
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 'Legacy shorthand: window length from today (1–366, default 365).
          Ignored when both start_date and end_date are supplied.'
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: Window end, EXCLUSIVE (check-out semantics). Required together
          with start_date; the window may span at most 366 days.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Window start, inclusive. Defaults to today.
      tags:
      - Rooms
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRoomOption'
          description: ''
  /api/rooms/availability/:
    get:
      operationId: rooms_availability_retrieve
      summary: Authoritative room availability search
      parameters:
      - in: query
        name: check_in
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: check_out
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: guests
        schema:
          type: integer
      - in: query
        name: room_type
        schema:
          type: string
        description: Room type slug or id
      - in: query
        name: rooms
        schema:
          type: integer
      tags:
      - Bookings
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityQuery'
          description: ''
components:
  schemas:
    AdminBookingCreate:
      type: object
      description: Staff manual booking (walk-in/phone). Guest details are mandatory.
      properties:
        room_type:
