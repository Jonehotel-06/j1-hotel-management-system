openapi: 3.0.3
info:
  title: J-ONE HOTEL & LODGE API
  version: 1.0.0
  description: REST API powering the J-ONE HOTEL & LODGE public website and staff
    hotel management dashboard. The frontend is an independently hosted HTML/CSS/Vanilla-JS
    application communicating with this API over JSON.
paths:
  /api/:
    get:
      operationId: root_retrieve
      summary: API index
      tags:
      - Meta
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/amenities/:
    get:
      operationId: admin_amenities_list
      tags:
      - Admin · Amenities
      security:
      - jwtAuth: []
      responses:
